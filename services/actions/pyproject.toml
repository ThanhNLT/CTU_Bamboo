[project]
name = "bamboo-actions"
version = "0.0.0"
description = "Hasura Actions, webhook xác thực và worker nền (flow-sync, search-sync, ai-worker, lakehouse-sink)"
requires-python = "==3.13.*"
dependencies = [
    "bamboo-common",
    "fastapi",
    "uvicorn",
    "uvloop",
    "httptools",
    "psycopg[binary]",
    "psycopg-pool",
    "httpx",
    "pyjwt[crypto]",
    "boto3",
    "jinja2",
    "presidio-analyzer",
    "presidio-anonymizer",
    "openpyxl",
    "pypdfium2",
    "pillow",
    "pyhanko",
    "pypdf>=7",
    "paho-mqtt>=2",
    "prometheus-client",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-psycopg",
]

[dependency-groups]
# Image bamboo-lakehouse (dịch vụ lakehouse-sink).
lakehouse = ["pyiceberg[pyarrow]", "sqlalchemy", "kafka-python"]
dev = [{ include-group = "lakehouse" }, "pytest", "pyyaml"]

[tool.uv]
package = false

[tool.uv.sources]
bamboo-common = { workspace = true }
