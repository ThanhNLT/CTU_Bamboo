[project]
name = "bamboo-ocr"
version = "0.0.0"
description = "OCR tiếng Việt (ADR #52): PaddleOCR + VietOCR trên PyTorch"
requires-python = "==3.11.*"
dependencies = [
    "fastapi",
    "uvicorn",
    "paddleocr",
    "transformers",
    "opencv-contrib-python",
    "einops",
    "gdown",
    "pyyaml",
    "requests",
    "vietocr",
    # Linux: image cài PyTorch riêng (bản CPU, tự tải bản CUDA khi có GPU NVIDIA, ADR #80). macOS Apple Silicon: OCR chạy
    # thẳng trên máy để dùng GPU Metal (ADR #90), PyTorch lấy từ PyPI.
    "torch==2.9.1; sys_platform == 'darwin'",
    "torchvision==0.24.1; sys_platform == 'darwin'",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
override-dependencies = [
  "pillow==11.3.0", "einops==0.8.2", "gdown==6.4.2",
  "imgaug; sys_platform == 'never'", "prefetch-generator; sys_platform == 'never'",
  "albumentations; sys_platform == 'never'", "lmdb; sys_platform == 'never'", "scikit-image; sys_platform == 'never'",
]
constraint-dependencies = [
  "aiohappyeyeballs==2.7.1",
