[tool.uv]
required-version = ">=0.13"
preview-features = ["package-conflicts"]
conflicts = [[{ package = "bamboo-docs" }, { package = "bamboo-actions" }]]

[tool.uv.workspace]
members = ["services/actions", "services/seed", "services/sleeper", "docs", "packages/*"]

[dependency-groups]
lint = ["ruff", "reuse"]
