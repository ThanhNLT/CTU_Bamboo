# Broker MQTT cho thiết bị / cổng OT (ADR #74). Không có tài khoản ẩn danh; tài khoản và quyền do plugin
# dynamic-security quản lý (openbao-init ghi cấu hình ban đầu, actions tạo tài khoản thiết bị theo công ty).
per_listener_settings false
listener 1883
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
max_packet_size 65536
max_inflight_messages 100
max_queued_messages 1000
