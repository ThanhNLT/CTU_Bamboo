# Broker MQTT cho thiết bị / cổng OT (ADR #74). Không có tài khoản ẩn danh; tài khoản và quyền do plugin
# dynamic-security quản lý (openbao-init ghi cấu hình ban đầu, actions tạo tài khoản thiết bị theo công ty).
per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
max_packet_size 65536
max_inflight_messages 100
max_queued_messages 1000

# 1883: không mã hóa, compose chỉ mở ra 127.0.0.1 (thử nghiệm trên máy chủ)
listener 1883

# 8883: TLS cho thiết bị / cổng OT trong mạng OT (MQTT_BIND), đăng nhập bằng tài khoản thiết bị
listener 8883
cafile /mosquitto/tls/ca.crt
certfile /mosquitto/tls/mosquitto.crt
keyfile /mosquitto/tls/mosquitto.key
tls_version tlsv1.2

# 8884: mTLS nội bộ (ADR #76) cho iot-bridge và actions: bắt buộc chứng chỉ do CA nội bộ OpenBao cấp, CN của chứng
# chỉ là tên đăng nhập (bamboo-bridge, bamboo-admin); không mở ra ngoài mạng Docker
listener 8884
cafile /mosquitto/tls/ca.crt
certfile /mosquitto/tls/mosquitto.crt
keyfile /mosquitto/tls/mosquitto.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
