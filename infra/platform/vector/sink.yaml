# Gửi nhật ký về actions; infra/compose/mtls.yml thay bằng sink-mtls.yaml (HTTPS, chứng chỉ máy khách).
sinks:
  bamboo:
    type: http
    inputs: [normalize]
    uri: http://actions:8000/obs/ingest
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_events: 200
      timeout_secs: 5
    request:
      headers:
        x-actions-secret: "${ACTIONS_SECRET}"
