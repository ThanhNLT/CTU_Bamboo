# infra/compose/mtls.yml: actions chỉ mở HTTPS bắt buộc chứng chỉ máy khách do CA nội bộ cấp (ADR #76).
sinks:
  bamboo:
    type: http
    inputs: [normalize]
    uri: https://actions:8443/obs/ingest
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_events: 200
      timeout_secs: 5
    tls:
      ca_file: /etc/vector/tls/ca.crt
      crt_file: /etc/vector/tls/vector.crt
      key_file: /etc/vector/tls/vector.key
    request:
      headers:
        x-actions-secret: "${ACTIONS_SECRET}"
