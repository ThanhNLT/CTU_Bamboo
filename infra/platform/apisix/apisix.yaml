# Node có chú thích BAMBOO_MTLS: bamboo-start đổi sang HTTPS với chứng chỉ máy khách khi bật mTLS nội bộ (mtls.yml).
upstreams:
  - id: web
    type: roundrobin
    nodes:
      "web:8080": 1
  - id: hasura
    type: roundrobin
    nodes:
      "hasura:8080": 1 # BAMBOO_MTLS hasura:8443
    timeout: { connect: 5, send: 60, read: 60 }
  - id: actions
    type: roundrobin
    nodes:
      "actions:8000": 1 # BAMBOO_MTLS actions:8443
    timeout: { connect: 5, send: 300, read: 300 }
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1 # BAMBOO_MTLS keycloak:8443
  - id: s3
    type: roundrobin
    nodes:
      "seaweedfs:8333": 1
    timeout: { connect: 5, send: 120, read: 120 }

plugin_configs:
  - id: waf
    plugins:
      coraza-filter:
        conf:
          directives_map:
            default:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
              - SecRuleUpdateTargetById 934110 "!ARGS:redirect_uri"
              - SecRuleUpdateTargetById 934110 "!ARGS:post_logout_redirect_uri"
              - >-
                SecRuleUpdateTargetByTag OWASP_CRS "!REQUEST_COOKIES:AUTH_SESSION_ID|!REQUEST_COOKIES:KC_AUTH_SESSION_HASH|!REQUEST_COOKIES:KC_RESTART|!REQUEST_COOKIES:KC_STATE_CHECKER|!REQUEST_COOKIES:KEYCLOAK_IDENTITY|!REQUEST_COOKIES:KEYCLOAK_SESSION|!REQUEST_COOKIES:KEYCLOAK_LOCALE"
          default_directives: default
  - id: waf-graphql
    plugins:
      coraza-filter:
        conf:
          directives_map:
            default:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
              - SecRuleRemoveByTag attack-sqli
          default_directives: default

# Truy vết OpenTelemetry (ADR #75): span cho mọi yêu cầu qua cổng, chuyển traceparent (W3C) cho Hasura, actions,
# Keycloak. Mặc định không lấy mẫu; bamboo-start.sh bật khi có OTEL_EXPORTER_OTLP_ENDPOINT (nhóm observability) và trỏ
# collector về đó.
plugin_metadata:
  - id: opentelemetry
    trace_id_source: random
    resource:
      service.name: bamboo-gateway
      service.namespace: bamboo
    collector:
      address: otel-collector:4318 # BAMBOO_OTEL_COLLECTOR
      request_timeout: 3
    batch_span_processor:
      drop_on_queue_full: true
      max_queue_size: 2048
      batch_timeout: 2
      inactive_timeout: 1
      max_export_batch_size: 256

global_rules:
  - id: 1
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      opentelemetry:
        sampler:
          name: always_off # BAMBOO_TRACE_SAMPLER
          options:
            root:
              name: always_on
        additional_attributes:
          - route_id
          - http_x_request_id
      prometheus: {}

routes:
  - id: canonical-host
    uri: /*
    hosts: ["127.0.0.1"]
    priority: 1000
    vars:
      - ["uri", "!", "==", "/healthz"]
    plugins:
      redirect:
        uri: "http://localhost:8000$request_uri"
        ret_code: 302

  # forward-auth không gắn được chứng chỉ máy khách: khi bật mTLS, nó gọi route này của chính cổng (chỉ nhận từ
  # 127.0.0.1), route chuyển tiếp tới actions qua upstream HTTPS. Không bật mTLS thì không có gì gọi tới đây.
  - id: internal-auth-gateway
    uri: /__bamboo/auth-gateway
    hosts: ["127.0.0.1"]
    priority: 1100
    methods: [GET]
    vars:
      - ["remote_addr", "==", "127.0.0.1"]
    upstream_id: actions
    plugins:
      proxy-rewrite:
        uri: /auth/gateway

  - id: healthz
    uri: /healthz
    priority: 100
    plugins:
      mocking:
        response_status: 200
        content_type: text/plain
        response_example: ok

  - id: graphql-ws
    uri: /graphql
    priority: 30
    vars:
      - ["http_upgrade", "~*", "websocket"]
    enable_websocket: true
    upstream_id: hasura
    plugins:
      proxy-rewrite:
        uri: /v1/graphql
      limit-count:
        count: 120
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều kết nối, thử lại sau"

  - id: graphql-preflight
    uri: /graphql
    priority: 20
    methods: [OPTIONS]
    upstream_id: hasura
    plugins:
      proxy-rewrite:
        uri: /v1/graphql

  - id: graphql
    uri: /graphql
    priority: 10
    methods: [POST, GET]
    upstream_id: hasura
    plugin_config_id: waf-graphql
    plugins:
      forward-auth:
        uri: http://actions:8000/auth/gateway
        request_method: GET
        request_headers: [Authorization]
        upstream_headers: [X-User-Sub]
        timeout: 3000
        status_on_error: 503
      limit-count:
        count: 600
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều yêu cầu, thử lại sau"
      client-control:
        max_body_size: 1048576
      proxy-rewrite:
        uri: /v1/graphql

  - id: ingest
    uris: [/ingest/*]
    priority: 15
    methods: [POST, GET]
    upstream_id: actions
    plugins:
      forward-auth:
        uri: http://actions:8000/auth/gateway
        request_method: GET
        request_headers: [Authorization]
        upstream_headers: [X-User-Sub]
        timeout: 3000
        status_on_error: 503
      limit-count:
        count: 30
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều lần nạp dữ liệu, thử lại sau"
      client-control:
        max_body_size: 67108864

  - id: automation-hooks
    uris: [/hooks/*]
    priority: 15
    methods: [POST]
    upstream_id: actions
    plugins:
      limit-count:
        count: 60
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều lần gọi webhook, thử lại sau"
      client-control:
        max_body_size: 65536

  - id: external-module-ui
    uris: [/ext/*]
    priority: 15
    methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
    upstream_id: actions
    plugins:
      limit-count:
        count: 600
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều yêu cầu tới mô-đun, thử lại sau"
      client-control:
        max_body_size: 10485760

  - id: external-module-api
    uris: [/ext-api/*]
    priority: 15
    methods: [GET, POST]
    upstream_id: actions
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều yêu cầu từ mô-đun, thử lại sau"
      client-control:
        max_body_size: 1048576

  - id: public-api
    uris: [/api/v1/*]
    priority: 15
    methods: [GET, POST]
    upstream_id: actions
    plugin_config_id: waf
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: http_authorization
        rejected_code: 429
        rejected_msg: "Khóa API vượt giới hạn 300 lượt mỗi phút, thử lại sau"
      client-control:
        max_body_size: 1048576

  - id: company-setup
    uris: [/setup/*]
    priority: 15
    methods: [GET, POST]
    upstream_id: actions
    plugins:
      limit-count:
        count: 30
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều yêu cầu khởi tạo, thử lại sau"
      client-control:
        max_body_size: 8388608

  - id: keycloak-master
    uris: [/realms/master, /realms/master/*]
    priority: 40
    plugins:
      mocking:
        response_status: 403
        content_type: text/plain
        response_example: "Forbidden"

  - id: keycloak-login
    uri: /realms/*
    priority: 20
    vars:
      - ["uri", "~~", "^/realms/[^/]+/(protocol/openid-connect/token|login-actions/)"]
    upstream_id: keycloak
    plugin_config_id: waf
    plugins:
      limit-count:
        count: 60
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều lần đăng nhập, thử lại sau"

  - id: keycloak
    uris: [/realms/*, /resources/*]
    priority: 10
    methods: [GET, POST, HEAD, OPTIONS]
    upstream_id: keycloak
    plugin_config_id: waf

  - id: s3-quarantine
    uri: /bms-quarantine/*
    priority: 10
    methods: [PUT, OPTIONS]
    upstream_id: s3
    plugins:
      client-control:
        max_body_size: 27262976

  - id: s3-documents
    uri: /bms-documents/*
    priority: 10
    methods: [GET, HEAD, OPTIONS]
    upstream_id: s3

  - id: web
    uri: /*
    priority: 0
    methods: [GET, HEAD]
    upstream_id: web
    plugin_config_id: waf
#END
