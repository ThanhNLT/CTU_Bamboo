apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_server_tokens: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  error_log_level: warn
  http:
    client_max_body_size: 30m

# Chỉ nạp plugin cổng dùng tới (danh sách thay hẳn danh sách mặc định của APISIX). opentelemetry không có trong danh
# sách mặc định; plugin WASM coraza-filter khai báo riêng ở mục wasm.
plugins:
  - request-id
  - opentelemetry
  - redirect
  - mocking
  - client-control
  - forward-auth
  - limit-count
  - proxy-rewrite
  - prometheus

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091

wasm:
  plugins:
    - name: coraza-filter
      priority: 7999
      file: /usr/local/apisix/proxywasm/coraza-proxy-wasm.wasm
