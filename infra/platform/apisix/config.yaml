apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_server_tokens: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  error_log_level: warn
  http:
    client_max_body_size: 30m

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091

wasm:
  plugins:
    - name: coraza-filter
      priority: 7999
      file: /usr/local/apisix/proxywasm/coraza-proxy-wasm.wasm
