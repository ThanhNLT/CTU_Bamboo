# Cho Ollama và dịch vụ OCR dùng GPU NVIDIA (cần nvidia-container-toolkit, xem docs/van-hanh/trien-khai.md):
#   Không cần dùng tệp này: sleeper tự chuyển Ollama, OCR sang GPU khi máy có (ADR #79). Chỉ dùng để ép GPU từ đầu:
#   docker compose -f compose.yaml -f infra/compose/gpu.yml up -d (máy không có card thì container không tạo được)
# Đây là tệp ghi đè (merge), không phải tệp include: đường dẫn tương đối (nếu thêm) tính từ gốc repo.
# Mô hình vẫn chỉ nạp lên GPU khi có việc và tự gỡ khi nhàn rỗi (ADR #52).
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama-core: *gpu
  ocr-core: *gpu
