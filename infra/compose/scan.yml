x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  clamav:
    logging: *logging
    profiles: [scan]
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"

