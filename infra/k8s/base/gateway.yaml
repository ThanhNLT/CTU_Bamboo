# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: gateway
        image: ghcr.io/ctubamboo/bamboo-gateway:0.5.2
        env:
        - name: _BAMBOO_GATEWAY_WORKERS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: GATEWAY_WORKERS
              optional: true
        - name: APISIX_WORKER_PROCESSES
          value: $(_BAMBOO_GATEWAY_WORKERS)
        ports:
        - containerPort: 9080
        - containerPort: 9091
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q ok <&3"
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      initContainers:
      - name: wait-actions
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 actions 8000; do sleep 2; done
      - name: wait-hasura
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 hasura 8080; do sleep 2; done
      - name: wait-keycloak
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 keycloak 8080; do sleep 2; done
      - name: wait-seaweedfs
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 seaweedfs 8333; do sleep 2; done
      - name: wait-web
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 web 8080; do sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
  - name: p9080
    port: 9080
    targetPort: 9080
  - name: p9091
    port: 9091
    targetPort: 9091
