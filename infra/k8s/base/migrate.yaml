# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: bamboo
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: migrate
        image: ghcr.io/thanhnlt/bamboo-migrate:0.5.2
        env:
        - name: _BAMBOO_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: POSTGRES_PASSWORD
              optional: true
        - name: ACTIONS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: ACTIONS_DB_PASSWORD
              optional: true
        - name: CDC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: CDC_DB_PASSWORD
              optional: true
        - name: FLOWABLE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: FLOWABLE_DB_PASSWORD
              optional: true
        - name: HASURA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: HASURA_DB_PASSWORD
              optional: true
        - name: KEYCLOAK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_DB_PASSWORD
              optional: true
        - name: LAKEHOUSE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: LAKEHOUSE_DB_PASSWORD
              optional: true
        - name: EXTRA_DATABASES
          value: flowable keycloak hasura_meta hasura_meta_test bms_hasura_test lakehouse
        - name: PGHOST
          value: db
        - name: PGPASSWORD
          value: $(_BAMBOO_POSTGRES_PASSWORD)
        - name: PGUSER
          value: bms
        - name: SERVICE_DATABASES
          value: keycloak:bamboo_keycloak flowable:bamboo_flowable hasura_meta:bamboo_hasura hasura_meta_test:bamboo_hasura
            lakehouse:bamboo_lakehouse
      initContainers:
      - name: wait-db
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 db 5432; do sleep 2; done
      restartPolicy: OnFailure
