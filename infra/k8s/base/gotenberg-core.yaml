# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg-core
  labels:
    app.kubernetes.io/name: gotenberg-core
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gotenberg-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotenberg-core
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: gotenberg-core
        image: gotenberg/gotenberg:8.37.0-chromium
        args:
        - gotenberg
        - --chromium-auto-start
        - --chromium-disable-javascript
        - --chromium-deny-private-ips
        - --chromium-deny-public-ips
        - --api-disable-download-from
        - --webhook-disable
        - --api-timeout=60s
        ports:
        - containerPort: 3000
        readinessProbe:
          exec:
            command:
            - curl
            - -fsS
            - -o
            - /dev/null
            - http://127.0.0.1:3000/health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg-core
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: gotenberg-core
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
