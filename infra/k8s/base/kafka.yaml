# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: kafka
        image: ghcr.io/thanhnlt/bamboo-kafka:0.5.2
        env:
        - name: _BAMBOO_KAFKA_HEAP
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KAFKA_HEAP
              optional: true
        - name: DEBEZIUM_KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: DEBEZIUM_KAFKA_PASSWORD
              optional: true
        - name: LAKEHOUSE_KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: LAKEHOUSE_KAFKA_PASSWORD
              optional: true
        - name: CLUSTER_ID
          value: b5T4hzPsQrOmfv9Kr38lIg
        - name: KAFKA_ADVERTISED_LISTENERS
          value: SASL_PLAINTEXT://kafka:9092,HOST://localhost:19092,LOCAL://localhost:9094
        - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
          value: 'false'
        - name: KAFKA_AUTHORIZER_CLASS_NAME
          value: org.apache.kafka.metadata.authorizer.StandardAuthorizer
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@localhost:9093
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_HEAP_OPTS
          value: $(_BAMBOO_KAFKA_HEAP)
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: LOCAL
        - name: KAFKA_JVM_PERFORMANCE_OPTS
          value: -server -XX:+UseSerialGC -XX:ReservedCodeCacheSize=96m -Djava.awt.headless=true
        - name: KAFKA_LISTENERS
          value: SASL_PLAINTEXT://:9092,HOST://:19092,CONTROLLER://localhost:9093,LOCAL://localhost:9094
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,HOST:SASL_PLAINTEXT
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        - name: KAFKA_LOG_RETENTION_HOURS
          value: '168'
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_NUM_PARTITIONS
          value: '1'
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_SASL_ENABLED_MECHANISMS
          value: SCRAM-SHA-512
        - name: KAFKA_SUPER_USERS
          value: User:ANONYMOUS
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: MALLOC_ARENA_MAX
          value: '2'
        ports:
        - containerPort: 9092
        - containerPort: 19092
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - test -f /tmp/bamboo-kafka-ready && exec 3<>/dev/tcp/127.0.0.1/9094
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
          readOnly: false
      volumes:
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
  - name: p9092
    port: 9092
    targetPort: 9092
  - name: p19092
    port: 19092
    targetPort: 19092
