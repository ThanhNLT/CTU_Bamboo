# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  labels:
    app.kubernetes.io/name: bootstrap
    app.kubernetes.io/part-of: bamboo
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: bootstrap
        image: ghcr.io/ctubamboo/bamboo-actions:0.5.2
        args:
        - python
        - -m
        - app.bootstrap
        env:
        - name: _BAMBOO_ACTIONS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: ACTIONS_DB_PASSWORD
              optional: true
        - name: _BAMBOO_FLOWABLE_ADMIN
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: FLOWABLE_ADMIN
              optional: true
        - name: _BAMBOO_FLOWABLE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: FLOWABLE_ADMIN_PASSWORD
              optional: true
        - name: _BAMBOO_KEYCLOAK_URL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_URL
              optional: true
        - name: ACTIONS_SECRET
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: ACTIONS_SECRET
              optional: true
        - name: AI_CHAT_MODEL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_CHAT_MODEL
              optional: true
        - name: AI_CPU_MODELS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_CPU_MODELS
              optional: true
        - name: AI_EMBED_MODEL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_EMBED_MODEL
              optional: true
        - name: AI_MIN_SCORE
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_MIN_SCORE
              optional: true
        - name: AI_STEP_TIMEOUT
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_STEP_TIMEOUT
              optional: true
        - name: BAMBOO_ENV
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: BAMBOO_ENV
              optional: true
        - name: CLAMAV_HOST
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: CLAMAV_HOST
              optional: true
        - name: CORS_ORIGINS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: CORS_ORIGINS
              optional: true
        - name: GRAFANA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: GRAFANA_ADMIN_PASSWORD
              optional: true
        - name: HASURA_ENABLE_CONSOLE
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: HASURA_ENABLE_CONSOLE
              optional: true
        - name: HASURA_GRAPHQL_ADMIN_SECRET
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: HASURA_GRAPHQL_ADMIN_SECRET
              optional: true
        - name: MQTT_HOST
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: MQTT_HOST
              optional: true
        - name: OLLAMA_URL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: OLLAMA_URL
              optional: true
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: OTEL_EXPORTER_OTLP_ENDPOINT
              optional: true
        - name: S3_PUBLIC_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: S3_PUBLIC_ENDPOINT
              optional: true
        - name: SCAN_REQUIRE_CLAMAV
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SCAN_REQUIRE_CLAMAV
              optional: true
        - name: SETUP_ALLOW_UNVERIFIED
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SETUP_ALLOW_UNVERIFIED
              optional: true
        - name: SETUP_OPEN_SIGNUP
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SETUP_OPEN_SIGNUP
              optional: true
        - name: SIGNATURE_ONLINE
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SIGNATURE_ONLINE
              optional: true
        - name: SMS_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SMS_GATEWAY_TOKEN
              optional: true
        - name: SMS_GATEWAY_URL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SMS_GATEWAY_URL
              optional: true
        - name: SMTP_FROM
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SMTP_FROM
              optional: true
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SMTP_HOST
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SMTP_PASSWORD
              optional: true
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SMTP_PORT
              optional: true
        - name: SMTP_STARTTLS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SMTP_STARTTLS
              optional: true
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SMTP_USER
              optional: true
        - name: WEBHOOK_ALLOW_PRIVATE
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: WEBHOOK_ALLOW_PRIVATE
              optional: true
        - name: DEMO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: DEMO_PASSWORD
              optional: true
        - name: KEYCLOAK_ADMIN_URL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_ADMIN_URL
              optional: true
        - name: WEB_ORIGIN
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: WEB_ORIGIN
              optional: true
        - name: BAO_ADDR
          value: http://openbao:8200
        - name: BAO_APPROLE_FILE
          value: /run/bms/approle.json
        - name: DATABASE_URL
          value: postgresql://bamboo_actions:$(_BAMBOO_ACTIONS_DB_PASSWORD)@db:5432/bms
        - name: FLOWABLE_PASSWORD
          value: $(_BAMBOO_FLOWABLE_ADMIN_PASSWORD)
        - name: FLOWABLE_URL
          value: http://flowable:8080/flowable-rest/service
        - name: FLOWABLE_USER
          value: $(_BAMBOO_FLOWABLE_ADMIN)
        - name: HASURA_URL
          value: http://hasura:8080
        - name: KEYCLOAK_ISSUER
          value: $(_BAMBOO_KEYCLOAK_URL)/realms/bms
        - name: KEYCLOAK_JWKS_URL
          value: http://keycloak:8080/realms/bms/protocol/openid-connect/certs
        - name: MALLOC_ARENA_MAX
          value: '2'
        - name: MQTT_TLS_DIR
          value: /run/bms/mqtt
        - name: S3_ENDPOINT
          value: http://seaweedfs:8333
        - name: TRINO_CA_FILE
          value: /run/bms/trino-ca.pem
        - name: TRINO_URL
          value: https://trino:8443
        - name: KEYCLOAK_INTERNAL_URL
          value: http://keycloak:8080
        volumeMounts:
        - name: bootstrap-secrets
          mountPath: /run/bms
          readOnly: true
      initContainers:
      - name: wait-flowable
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 flowable 8080; do sleep 2; done
      - name: wait-hasura
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 hasura 8080; do sleep 2; done
      - name: wait-keycloak
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 keycloak 8080; do sleep 2; done
      - name: wait-meilisearch
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 meilisearch 7700; do sleep 2; done
      - name: wait-openbao-init
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/openbao-init
        - --timeout=3600s
      - name: wait-seaweedfs
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 seaweedfs 8333; do sleep 2; done
      volumes:
      - name: bootstrap-secrets
        persistentVolumeClaim:
          claimName: bootstrap-secrets
      restartPolicy: OnFailure
