# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasura
  labels:
    app.kubernetes.io/name: hasura
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hasura
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hasura
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: hasura
        image: hasura/graphql-engine:v2.51.0-ce
        env:
        - name: _BAMBOO_CORS_ORIGINS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: CORS_ORIGINS
              optional: true
        - name: _BAMBOO_HASURA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: HASURA_DB_PASSWORD
              optional: true
        - name: _BAMBOO_HASURA_ENABLE_CONSOLE
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: HASURA_ENABLE_CONSOLE
              optional: true
        - name: ACTIONS_SECRET
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: ACTIONS_SECRET
              optional: true
        - name: HASURA_GRAPHQL_ADMIN_SECRET
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: HASURA_GRAPHQL_ADMIN_SECRET
              optional: true
        - name: HASURA_GRAPHQL_AUTH_HOOK_MODE
          value: GET
        - name: HASURA_GRAPHQL_CORS_DOMAIN
          value: $(_BAMBOO_CORS_ORIGINS)
        - name: HASURA_GRAPHQL_ENABLED_LOG_TYPES
          value: startup, http-log, webhook-log
        - name: HASURA_GRAPHQL_ENABLE_CONSOLE
          value: $(_BAMBOO_HASURA_ENABLE_CONSOLE)
        - name: ACTIONS_URL
          value: http://actions:8000
        - name: BMS_DATABASE_URL
          value: postgres://bamboo_hasura:$(_BAMBOO_HASURA_DB_PASSWORD)@db:5432/bms
        - name: HASURA_GRAPHQL_AUTH_HOOK
          value: http://actions:8000/auth/hasura
        - name: HASURA_GRAPHQL_METADATA_DATABASE_URL
          value: postgres://bamboo_hasura:$(_BAMBOO_HASURA_DB_PASSWORD)@db:5432/hasura_meta
        ports:
        - containerPort: 8080
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q OK <&3"
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      initContainers:
      - name: wait-migrate
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/migrate
        - --timeout=3600s
---
apiVersion: v1
kind: Service
metadata:
  name: hasura
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: hasura
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
