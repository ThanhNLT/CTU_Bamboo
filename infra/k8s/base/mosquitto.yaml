# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: mosquitto
        image: ghcr.io/thanhnlt/bamboo-mosquitto:0.5.2
        ports:
        - containerPort: 1883
        - containerPort: 8883
        - containerPort: 8884
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - nc -z 127.0.0.1 1883
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: mosquitto-data
          mountPath: /mosquitto/data
          readOnly: false
        - name: mosquitto-tls
          mountPath: /mosquitto/tls
          readOnly: true
      initContainers:
      - name: wait-openbao-init
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/openbao-init
        - --timeout=3600s
      volumes:
      - name: mosquitto-data
        persistentVolumeClaim:
          claimName: mosquitto-data
      - name: mosquitto-tls
        persistentVolumeClaim:
          claimName: mosquitto-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
  - name: p1883
    port: 1883
    targetPort: 1883
  - name: p8883
    port: 8883
    targetPort: 8883
  - name: p8884
    port: 8884
    targetPort: 8884
