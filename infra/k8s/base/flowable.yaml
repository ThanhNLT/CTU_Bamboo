# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowable
  labels:
    app.kubernetes.io/name: flowable
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flowable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowable
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: flowable
        image: flowable/flowable-rest:8.0.0
        env:
        - name: _BAMBOO_FLOWABLE_ADMIN
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: FLOWABLE_ADMIN
              optional: true
        - name: _BAMBOO_FLOWABLE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: FLOWABLE_ADMIN_PASSWORD
              optional: true
        - name: _BAMBOO_FLOWABLE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: FLOWABLE_DB_PASSWORD
              optional: true
        - name: _BAMBOO_FLOWABLE_JAVA_OPTS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: FLOWABLE_JAVA_OPTS
              optional: true
        - name: FLOWABLE_REST_APP_ADMIN_PASSWORD
          value: $(_BAMBOO_FLOWABLE_ADMIN_PASSWORD)
        - name: FLOWABLE_REST_APP_ADMIN_USER_ID
          value: $(_BAMBOO_FLOWABLE_ADMIN)
        - name: FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS
          value: 'false'
        - name: JAVA_OPTS
          value: $(_BAMBOO_FLOWABLE_JAVA_OPTS)
        - name: MALLOC_ARENA_MAX
          value: '2'
        - name: SPRING_DATASOURCE_PASSWORD
          value: $(_BAMBOO_FLOWABLE_DB_PASSWORD)
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://db:5432/flowable
        - name: SPRING_DATASOURCE_USERNAME
          value: bamboo_flowable
        ports:
        - containerPort: 8080
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - nc -z 127.0.0.1 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      initContainers:
      - name: wait-migrate
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/migrate
        - --timeout=3600s
---
apiVersion: v1
kind: Service
metadata:
  name: flowable
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: flowable
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
