# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-core
  labels:
    app.kubernetes.io/name: trino-core
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trino-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino-core
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: trino-core
        image: ghcr.io/ctubamboo/bamboo-trino:0.5.2
        env:
        - name: MALLOC_ARENA_MAX
          value: '2'
        ports:
        - containerPort: 8443
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - /usr/lib/trino/bin/health-check
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: trino-catalog
          mountPath: /etc/trino/bms-catalog
          readOnly: true
        - name: trino-secrets
          mountPath: /etc/trino/secrets
          readOnly: true
      initContainers:
      - name: wait-migrate
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/migrate
        - --timeout=3600s
      - name: wait-openbao-init
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/openbao-init
        - --timeout=3600s
      - name: wait-seaweedfs
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 seaweedfs 8333; do sleep 2; done
      volumes:
      - name: trino-catalog
        persistentVolumeClaim:
          claimName: trino-catalog
      - name: trino-secrets
        persistentVolumeClaim:
          claimName: trino-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: trino-core
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: trino-core
  ports:
  - name: p8443
    port: 8443
    targetPort: 8443
