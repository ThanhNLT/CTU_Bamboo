# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: web
        image: ghcr.io/ctubamboo/bamboo-web:0.5.2
        env:
        - name: _BAMBOO_HASURA_PUBLIC_URL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: HASURA_PUBLIC_URL
              optional: true
        - name: _BAMBOO_KEYCLOAK_URL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_URL
              optional: true
        - name: _BAMBOO_WEB_ORIGIN
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: WEB_ORIGIN
              optional: true
        - name: BAMBOO_EXT_URL
          value: $(_BAMBOO_WEB_ORIGIN)/ext
        - name: BAMBOO_HASURA_URL
          value: $(_BAMBOO_HASURA_PUBLIC_URL)
        - name: BAMBOO_KEYCLOAK_URL
          value: $(_BAMBOO_KEYCLOAK_URL)
        - name: BAMBOO_SETUP_URL
          value: $(_BAMBOO_WEB_ORIGIN)/setup
        ports:
        - containerPort: 8080
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - wget -q -O /dev/null http://127.0.0.1:8080/healthz
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
