# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: openbao
        image: ghcr.io/thanhnlt/bamboo-openbao:0.5.2
        args:
        - server
        ports:
        - containerPort: 8200
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbycode=200'
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: openbao-data
          mountPath: /openbao/file
          readOnly: false
      volumes:
      - name: openbao-data
        persistentVolumeClaim:
          claimName: openbao-data
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: openbao
  ports:
  - name: p8200
    port: 8200
    targetPort: 8200
