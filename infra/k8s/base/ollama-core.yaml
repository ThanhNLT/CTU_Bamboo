# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-core
  labels:
    app.kubernetes.io/name: ollama-core
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-core
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: ollama-core
        image: ollama/ollama:0.35.1
        command:
        - sh
        - -c
        - "(until ollama list > /dev/null 2>&1; do sleep 1; done\nfor m in \"$AI_CHAT_MODEL\" \"$AI_EMBED_MODEL\"; do\n  ollama\
          \ show --modelfile \"$m\" 2> /dev/null | sed -n 's/^FROM \\(\\/.*\\)/\\1/p' | xargs -r cat > /dev/null\ndone) &\n\
          exec ollama serve\n"
        env:
        - name: _BAMBOO_AI_KEEP_ALIVE
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_KEEP_ALIVE
              optional: true
        - name: _BAMBOO_AI_KV_CACHE_TYPE
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_KV_CACHE_TYPE
              optional: true
        - name: AI_CHAT_MODEL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_CHAT_MODEL
              optional: true
        - name: AI_EMBED_MODEL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_EMBED_MODEL
              optional: true
        - name: OLLAMA_MAX_LOADED_MODELS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: OLLAMA_MAX_LOADED_MODELS
              optional: true
        - name: OLLAMA_CONTEXT_LENGTH
          value: '12288'
        - name: OLLAMA_FLASH_ATTENTION
          value: '1'
        - name: OLLAMA_KEEP_ALIVE
          value: $(_BAMBOO_AI_KEEP_ALIVE)
        - name: OLLAMA_KV_CACHE_TYPE
          value: $(_BAMBOO_AI_KV_CACHE_TYPE)
        - name: OLLAMA_NUM_PARALLEL
          value: '1'
        ports:
        - containerPort: 11434
        readinessProbe:
          exec:
            command:
            - ollama
            - list
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
          readOnly: false
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-core
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: ollama-core
  ports:
  - name: p11434
    port: 11434
    targetPort: 11434
