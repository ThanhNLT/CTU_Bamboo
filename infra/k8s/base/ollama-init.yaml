# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-init
  labels:
    app.kubernetes.io/name: ollama-init
    app.kubernetes.io/part-of: bamboo
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-init
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: ollama-init
        image: ollama/ollama:0.35.1
        command:
        - sh
        - -c
        - 'for m in "$AI_CHAT_MODEL" "$AI_EMBED_MODEL"; do ollama show "$m" > /dev/null 2>&1 || ollama pull "$m" || echo "CẢNH
          BÁO: không tải được mô hình $m, AI chưa dùng được" >&2; done'
        env:
        - name: AI_CHAT_MODEL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_CHAT_MODEL
              optional: true
        - name: AI_EMBED_MODEL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_EMBED_MODEL
              optional: true
        - name: OLLAMA_HOST
          value: http://ollama:11434
      initContainers:
      - name: wait-ollama-core
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 ollama-core 11434; do sleep 2; done
      restartPolicy: OnFailure
