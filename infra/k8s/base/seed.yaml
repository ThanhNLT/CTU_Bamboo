# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/part-of: bamboo
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: seed
        image: ghcr.io/ctubamboo/bamboo-seed:0.5.2
        args:
        - python
        - -m
        - app.seed
        env:
        - name: _BAMBOO_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: POSTGRES_PASSWORD
              optional: true
        - name: AI_CHAT_MODEL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: AI_CHAT_MODEL
              optional: true
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_ADMIN
              optional: true
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_ADMIN_PASSWORD
              optional: true
        - name: SEED_DEMO
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: SEED_DEMO
              optional: true
        - name: DATABASE_URL
          value: postgresql://bms:$(_BAMBOO_POSTGRES_PASSWORD)@db:5432/bms
        - name: KEYCLOAK_INTERNAL_URL
          value: http://keycloak:8080
      initContainers:
      - name: wait-migrate
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/migrate
        - --timeout=3600s
      restartPolicy: OnFailure
