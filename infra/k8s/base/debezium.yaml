# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium
  labels:
    app.kubernetes.io/name: debezium
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: debezium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debezium
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: debezium
        image: quay.io/debezium/server:3.7.0.Final
        env:
        - name: _BAMBOO_CDC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: CDC_DB_PASSWORD
              optional: true
        - name: _BAMBOO_DEBEZIUM_JAVA_OPTS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: DEBEZIUM_JAVA_OPTS
              optional: true
        - name: _BAMBOO_DEBEZIUM_KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: DEBEZIUM_KAFKA_PASSWORD
              optional: true
        - name: DEBEZIUM_FORMAT_KEY
          value: json
        - name: DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE
          value: 'false'
        - name: DEBEZIUM_FORMAT_VALUE
          value: json
        - name: DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE
          value: 'false'
        - name: DEBEZIUM_SINK_KAFKA_PRODUCER_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: DEBEZIUM_SINK_KAFKA_PRODUCER_KEY_SERIALIZER
          value: org.apache.kafka.common.serialization.StringSerializer
        - name: DEBEZIUM_SINK_KAFKA_PRODUCER_SASL_JAAS_CONFIG
          value: org.apache.kafka.common.security.scram.ScramLoginModule required username="debezium" password="$(_BAMBOO_DEBEZIUM_KAFKA_PASSWORD)";
        - name: DEBEZIUM_SINK_KAFKA_PRODUCER_SASL_MECHANISM
          value: SCRAM-SHA-512
        - name: DEBEZIUM_SINK_KAFKA_PRODUCER_SECURITY_PROTOCOL
          value: SASL_PLAINTEXT
        - name: DEBEZIUM_SINK_KAFKA_PRODUCER_VALUE_SERIALIZER
          value: org.apache.kafka.common.serialization.StringSerializer
        - name: DEBEZIUM_SINK_TYPE
          value: kafka
        - name: DEBEZIUM_SOURCE_COLUMN_EXCLUDE_LIST
          value: core.attachment_ocr.page_texts,core.person.birth_year,core.person.phone,core.person.email
        - name: DEBEZIUM_SOURCE_CONNECTOR_CLASS
          value: io.debezium.connector.postgresql.PostgresConnector
        - name: DEBEZIUM_SOURCE_DATABASE_DBNAME
          value: bms
        - name: DEBEZIUM_SOURCE_DATABASE_HOSTNAME
          value: db
        - name: DEBEZIUM_SOURCE_DATABASE_PASSWORD
          value: $(_BAMBOO_CDC_DB_PASSWORD)
        - name: DEBEZIUM_SOURCE_DATABASE_PORT
          value: '5432'
        - name: DEBEZIUM_SOURCE_DATABASE_USER
          value: bamboo_cdc
        - name: DEBEZIUM_SOURCE_DECIMAL_HANDLING_MODE
          value: string
        - name: DEBEZIUM_SOURCE_HEARTBEAT_ACTION_QUERY
          value: UPDATE cdc.heartbeat SET beat_at = now() WHERE id = 1
        - name: DEBEZIUM_SOURCE_HEARTBEAT_INTERVAL_MS
          value: '10000'
        - name: DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS
          value: '5000'
        - name: DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME
          value: /debezium/data/offsets.dat
        - name: DEBEZIUM_SOURCE_PLUGIN_NAME
          value: pgoutput
        - name: DEBEZIUM_SOURCE_PUBLICATION_AUTOCREATE_MODE
          value: disabled
        - name: DEBEZIUM_SOURCE_PUBLICATION_NAME
          value: bms_cdc
        - name: DEBEZIUM_SOURCE_SCHEMA_INCLUDE_LIST
          value: core,mdm,wf,proc,ic,mfg,collab,cdc
        - name: DEBEZIUM_SOURCE_SLOT_NAME
          value: bms_debezium
        - name: DEBEZIUM_SOURCE_SNAPSHOT_MODE
          value: when_needed
        - name: DEBEZIUM_SOURCE_TOPIC_PREFIX
          value: bms
        - name: JAVA_OPTS
          value: $(_BAMBOO_DEBEZIUM_JAVA_OPTS)
        - name: MALLOC_ARENA_MAX
          value: '2'
        ports:
        - containerPort: 8080
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /q/health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q '\
              \ 200 '"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: debezium-data
          mountPath: /debezium/data
          readOnly: false
      initContainers:
      - name: wait-kafka
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z -w 2 kafka 9092; do sleep 2; done
      - name: wait-migrate
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/migrate
        - --timeout=3600s
      volumes:
      - name: debezium-data
        persistentVolumeClaim:
          claimName: debezium-data
---
apiVersion: v1
kind: Service
metadata:
  name: debezium
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: debezium
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
