# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: batch/v1
kind: Job
metadata:
  name: ocr-init
  labels:
    app.kubernetes.io/name: ocr-init
    app.kubernetes.io/part-of: bamboo
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocr-init
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: ocr-init
        image: ghcr.io/ctubamboo/bamboo-ocr:0.5.2
        args:
        - python
        - -m
        - app.download
        volumeMounts:
        - name: ocr-models
          mountPath: /models
          readOnly: false
      volumes:
      - name: ocr-models
        persistentVolumeClaim:
          claimName: ocr-models
      restartPolicy: OnFailure
