# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup
  labels:
    app.kubernetes.io/name: backup
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: backup
        image: ghcr.io/ctubamboo/bamboo-migrate:0.5.2
        command:
        - bash
        - /repo/tools/ops/backup-scheduler.sh
        env:
        - name: _BAMBOO_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: POSTGRES_PASSWORD
              optional: true
        - name: BACKUP_FIRST_DELAY
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: BACKUP_FIRST_DELAY
              optional: true
        - name: BACKUP_INTERVAL_HOURS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: BACKUP_INTERVAL_HOURS
              optional: true
        - name: BACKUP_KEEP
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: BACKUP_KEEP
              optional: true
        - name: BACKUP_DIR
          value: /backups
        - name: PGHOST
          value: db
        - name: PGPASSWORD
          value: $(_BAMBOO_POSTGRES_PASSWORD)
        - name: PGUSER
          value: bms
        volumeMounts:
        - name: backups
          mountPath: /backups
          readOnly: false
      initContainers:
      - name: wait-migrate
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/migrate
        - --timeout=3600s
      volumes:
      - name: backups
        persistentVolumeClaim:
          claimName: backups
