# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-core
  labels:
    app.kubernetes.io/name: ocr-core
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ocr-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocr-core
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: ocr-core
        image: ghcr.io/thanhnlt/bamboo-ocr:0.5.2
        env:
        - name: OCR_GPU_PRECISION
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: OCR_GPU_PRECISION
              optional: true
        - name: OCR_IDLE_SECONDS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: OCR_IDLE_SECONDS
              optional: true
        - name: OCR_THREADS
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: OCR_THREADS
              optional: true
        - name: HF_HUB_OFFLINE
          value: '1'
        ports:
        - containerPort: 8000
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: ocr-models
          mountPath: /models
          readOnly: false
        - name: ocr-accel
          mountPath: /opt/accel
          readOnly: false
      initContainers:
      - name: wait-ocr-init
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/ocr-init
        - --timeout=3600s
      volumes:
      - name: ocr-models
        persistentVolumeClaim:
          claimName: ocr-models
      - name: ocr-accel
        persistentVolumeClaim:
          claimName: ocr-accel
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-core
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: ocr-core
  ports:
  - name: p8000
    port: 8000
    targetPort: 8000
