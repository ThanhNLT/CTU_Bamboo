# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: keycloak
        image: ghcr.io/thanhnlt/bamboo-keycloak:0.5.2
        args:
        - $(_BAMBOO_KEYCLOAK_MODE)
        - --import-realm
        env:
        - name: _BAMBOO_KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_ADMIN
              optional: true
        - name: _BAMBOO_KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_ADMIN_PASSWORD
              optional: true
        - name: _BAMBOO_KEYCLOAK_ADMIN_URL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_ADMIN_URL
              optional: true
        - name: _BAMBOO_KEYCLOAK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_DB_PASSWORD
              optional: true
        - name: _BAMBOO_KEYCLOAK_DB_POOL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_DB_POOL
              optional: true
        - name: _BAMBOO_KEYCLOAK_HEAP
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_HEAP
              optional: true
        - name: _BAMBOO_KEYCLOAK_MODE
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_MODE
              optional: true
        - name: _BAMBOO_KEYCLOAK_URL
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: KEYCLOAK_URL
              optional: true
        - name: DEMO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: DEMO_PASSWORD
              optional: true
        - name: WEB_ORIGIN
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: WEB_ORIGIN
              optional: true
        - name: JAVA_OPTS_KC_HEAP
          value: $(_BAMBOO_KEYCLOAK_HEAP)
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: $(_BAMBOO_KEYCLOAK_ADMIN_PASSWORD)
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: $(_BAMBOO_KEYCLOAK_ADMIN)
        - name: KC_DB
          value: postgres
        - name: KC_DB_PASSWORD
          value: $(_BAMBOO_KEYCLOAK_DB_PASSWORD)
        - name: KC_DB_POOL_MAX_SIZE
          value: $(_BAMBOO_KEYCLOAK_DB_POOL)
        - name: KC_DB_URL
          value: jdbc:postgresql://db:5432/keycloak
        - name: KC_DB_USERNAME
          value: bamboo_keycloak
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_HOSTNAME
          value: $(_BAMBOO_KEYCLOAK_URL)
        - name: KC_HOSTNAME_ADMIN
          value: $(_BAMBOO_KEYCLOAK_ADMIN_URL)
        - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
          value: 'true'
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_METRICS_ENABLED
          value: 'true'
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: MALLOC_ARENA_MAX
          value: '2'
        ports:
        - containerPort: 8080
        - containerPort: 9000
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      initContainers:
      - name: wait-migrate
        image: registry.k8s.io/kubectl:v1.37.2
        args:
        - wait
        - --for=condition=complete
        - job/migrate
        - --timeout=3600s
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
  - name: p9000
    port: 9000
    targetPort: 9000
