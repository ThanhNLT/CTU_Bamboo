# Cụm k3s thử (CI, máy dev với k3d): image dựng tại chỗ thẻ dev, Secret bamboo-settings từ giá trị mặc định của dev
# (settings.env, sinh bằng tools/k8s/generate.py), bỏ các dịch vụ nặng không cần cho kiểm thử cổng API.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bamboo
resources:
  - ../../base
  - namespace.yaml
secretGenerator:
  - name: bamboo-settings
    envs: [settings.env]
    options:
      disableNameSuffixHash: true
images:
  - name: ghcr.io/thanhnlt/bamboo-actions
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-lakehouse
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-seed
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-migrate
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-ocr
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-web
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-keycloak
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-openbao
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-gateway
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-trino
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-kafka
    newTag: dev
  - name: ghcr.io/thanhnlt/bamboo-mosquitto
    newTag: dev
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ollama-core
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ocr-core
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ai-worker
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: trino-core
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kafka
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: debezium
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: lakehouse-sink
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: iot-bridge
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mosquitto
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backup
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ollama-init
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ocr-init
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: trino-init
