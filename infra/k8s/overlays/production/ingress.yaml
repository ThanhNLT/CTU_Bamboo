# Cổng API (APISIX) là điểm vào duy nhất, như cổng 8000 của compose. Đổi host thành tên miền thật và trỏ WEB_ORIGIN,
# KEYCLOAK_URL, HASURA_PUBLIC_URL, S3_PUBLIC_ENDPOINT, CORS_ORIGINS trong Secret bamboo-settings về cùng tên miền. TLS:
# thêm mục tls (cert-manager) hoặc để reverse proxy phía trước lo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
spec:
  rules:
    - host: bamboo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 9080
