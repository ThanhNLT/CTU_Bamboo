# Argo CD đồng bộ overlay production từ nhánh main: Git là nguồn sự thật, sửa tay trong cụm bị đưa về (selfHeal), tài
# nguyên bỏ khỏi Git bị xóa (prune). Áp một lần: kubectl apply -n argocd -f infra/k8s/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bamboo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ThanhNLT/CTU_Bamboo.git
    targetRevision: main
    path: infra/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: bamboo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
