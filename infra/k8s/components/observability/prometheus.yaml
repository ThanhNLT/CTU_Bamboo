# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=$(_BAMBOO_PROMETHEUS_RETENTION)
        env:
        - name: _BAMBOO_PROMETHEUS_RETENTION
          valueFrom:
            secretKeyRef:
              name: bamboo-settings
              key: PROMETHEUS_RETENTION
              optional: true
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-data
          mountPath: /prometheus
          readOnly: false
        - name: prometheus-infra-platform-observability-prometheus-yml
          mountPath: /etc/prometheus/prometheus.yml
          subPath: content
          readOnly: true
        - name: prometheus-infra-platform-observability-alerts-yml
          mountPath: /etc/prometheus/alerts.yml
          subPath: content
          readOnly: true
        resources:
          limits:
            memory: 384Mi
      volumes:
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data
      - name: prometheus-infra-platform-observability-prometheus-yml
        configMap:
          name: prometheus-infra-platform-observability-prometheus-yml
      - name: prometheus-infra-platform-observability-alerts-yml
        configMap:
          name: prometheus-infra-platform-observability-alerts-yml
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: p9090
    port: 9090
    targetPort: 9090
