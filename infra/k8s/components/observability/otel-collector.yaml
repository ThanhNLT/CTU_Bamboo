# Sinh bằng tools/k8s/generate.py từ cấu hình Docker Compose; đừng sửa tay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: bamboo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: bamboo
    spec:
      serviceAccountName: bamboo
      enableServiceLinks: false
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector:0.164.0
        args:
        - --config=/etc/otelcol/config.yaml
        ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 8888
        volumeMounts:
        - name: otel-collector-infra-platform-observability-otel-collector-yaml
          mountPath: /etc/otelcol/config.yaml
          subPath: content
          readOnly: true
        resources:
          limits:
            memory: 160Mi
      volumes:
      - name: otel-collector-infra-platform-observability-otel-collector-yaml
        configMap:
          name: otel-collector-infra-platform-observability-otel-collector-yaml
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/part-of: bamboo
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
  - name: p4317
    port: 4317
    targetPort: 4317
  - name: p4318
    port: 4318
    targetPort: 4318
  - name: p8888
    port: 8888
    targetPort: 8888
