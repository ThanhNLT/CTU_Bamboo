# Một node vừa điều phối vừa xử lý. Catalog ở thư mục riêng (volume do openbao-init ghi), không dùng các catalog
# mẫu của image.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static
catalog.config-dir=/etc/trino/bms-catalog
query.max-memory=512MB
query.max-memory-per-node=512MB

# Xác thực (ADR #45): client chỉ đăng nhập được qua HTTPS 8443 (chứng chỉ do CA nội bộ của OpenBao cấp), bằng tài
# khoản dịch vụ trong password.db. Cổng HTTP 8080 chỉ còn cho giao tiếp nội bộ (khóa ký shared-secret) và
# /v1/info của healthcheck; gửi mật khẩu qua HTTP bị từ chối. Tệp bí mật do openbao-init ghi vào /etc/trino/secrets.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/secrets/trino.pem
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
