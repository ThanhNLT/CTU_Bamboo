upstreams:
  - id: web
    type: roundrobin
    nodes:
      "web:8080": 1
  - id: hasura
    type: roundrobin
    nodes:
      "hasura:8080": 1
    timeout: { connect: 5, send: 60, read: 60 }
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1
  - id: s3
    type: roundrobin
    nodes:
      "seaweedfs:8333": 1
    timeout: { connect: 5, send: 120, read: 120 }

plugin_configs:
  - id: waf
    plugins:
      coraza-filter:
        conf:
          directives_map:
            default:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
              - SecRuleUpdateTargetById 934110 "!ARGS:redirect_uri"
              - SecRuleUpdateTargetById 934110 "!ARGS:post_logout_redirect_uri"
              - >-
                SecRuleUpdateTargetByTag OWASP_CRS "!REQUEST_COOKIES:AUTH_SESSION_ID|!REQUEST_COOKIES:KC_AUTH_SESSION_HASH|!REQUEST_COOKIES:KC_RESTART|!REQUEST_COOKIES:KC_STATE_CHECKER|!REQUEST_COOKIES:KEYCLOAK_IDENTITY|!REQUEST_COOKIES:KEYCLOAK_SESSION|!REQUEST_COOKIES:KEYCLOAK_LOCALE"
          default_directives: default
  - id: waf-graphql
    plugins:
      coraza-filter:
        conf:
          directives_map:
            default:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
              - SecRuleRemoveByTag attack-sqli
          default_directives: default

global_rules:
  - id: 1
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      prometheus: {}

routes:
  - id: canonical-host
    uri: /*
    hosts: ["127.0.0.1"]
    priority: 1000
    vars:
      - ["uri", "!", "==", "/healthz"]
    plugins:
      redirect:
        uri: "http://localhost:8000$request_uri"
        ret_code: 302

  - id: healthz
    uri: /healthz
    priority: 100
    plugins:
      mocking:
        response_status: 200
        content_type: text/plain
        response_example: ok

  - id: graphql-ws
    uri: /graphql
    priority: 30
    vars:
      - ["http_upgrade", "~*", "websocket"]
    enable_websocket: true
    upstream_id: hasura
    plugins:
      proxy-rewrite:
        uri: /v1/graphql
      limit-count:
        count: 120
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều kết nối, thử lại sau"

  - id: graphql-preflight
    uri: /graphql
    priority: 20
    methods: [OPTIONS]
    upstream_id: hasura
    plugins:
      proxy-rewrite:
        uri: /v1/graphql

  - id: graphql
    uri: /graphql
    priority: 10
    methods: [POST, GET]
    upstream_id: hasura
    plugin_config_id: waf-graphql
    plugins:
      forward-auth:
        uri: http://actions:8000/auth/gateway
        request_method: GET
        request_headers: [Authorization]
        upstream_headers: [X-User-Sub]
        timeout: 3000
      limit-count:
        count: 600
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều yêu cầu, thử lại sau"
      client-control:
        max_body_size: 1048576
      proxy-rewrite:
        uri: /v1/graphql

  - id: keycloak-master
    uris: [/realms/master, /realms/master/*]
    priority: 40
    plugins:
      mocking:
        response_status: 403
        content_type: text/plain
        response_example: "Forbidden"

  - id: keycloak-login
    uri: /realms/*
    priority: 20
    vars:
      - ["uri", "~~", "^/realms/[^/]+/(protocol/openid-connect/token|login-actions/)"]
    upstream_id: keycloak
    plugin_config_id: waf
    plugins:
      limit-count:
        count: 60
        time_window: 60
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Quá nhiều lần đăng nhập, thử lại sau"

  - id: keycloak
    uris: [/realms/*, /resources/*]
    priority: 10
    methods: [GET, POST, HEAD, OPTIONS]
    upstream_id: keycloak
    plugin_config_id: waf

  - id: s3-quarantine
    uri: /bms-quarantine/*
    priority: 10
    methods: [PUT, OPTIONS]
    upstream_id: s3
    plugins:
      client-control:
        max_body_size: 27262976

  - id: s3-documents
    uri: /bms-documents/*
    priority: 10
    methods: [GET, HEAD, OPTIONS]
    upstream_id: s3

  - id: web
    uri: /*
    priority: 0
    methods: [GET, HEAD]
    upstream_id: web
    plugin_config_id: waf
#END
