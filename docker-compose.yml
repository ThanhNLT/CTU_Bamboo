name: bamboo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-env: &db-env
  PGHOST: db
  PGUSER: bms
  PGPASSWORD: ${POSTGRES_PASSWORD:-bms-dev}

x-actions-env: &actions-env
  BAMBOO_ENV: ${BAMBOO_ENV:-development}
  DATABASE_URL: postgresql://bamboo_actions:${ACTIONS_DB_PASSWORD:-actions-db-dev}@db:5432/bms
  ACTIONS_SECRET: ${ACTIONS_SECRET:-dev-actions-secret}
  FLOWABLE_URL: http://flowable:8080/flowable-rest/service
  FLOWABLE_USER: ${FLOWABLE_ADMIN:-rest-admin}
  FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-test}
  HASURA_URL: http://hasura:8080
  HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-dev-admin-secret}
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/bms/protocol/openid-connect/certs
  KEYCLOAK_ISSUER: ${KEYCLOAK_URL:-http://localhost:8000}/realms/bms
  S3_ENDPOINT: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8000}
  BAO_ADDR: http://openbao:8200
  BAO_APPROLE_FILE: /run/bms/approle.json
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  SCAN_REQUIRE_CLAMAV: ${SCAN_REQUIRE_CLAMAV:-false}
  SMTP_HOST: ${SMTP_HOST-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-Bamboo DX-OS <no-reply@bamboo.local>}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
  SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
  WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
  SIGNATURE_ONLINE: ${SIGNATURE_ONLINE:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173}
  SETUP_ALLOW_UNVERIFIED: ${SETUP_ALLOW_UNVERIFIED:-true}
  TRINO_URL: https://trino:8443
  TRINO_CA_FILE: /run/bms/trino-ca.pem
  OLLAMA_URL: ${OLLAMA_URL-http://ollama:11434}
  AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b}
  AI_EMBED_MODEL: ${AI_EMBED_MODEL:-bge-m3}
  AI_MIN_SCORE: ${AI_MIN_SCORE:-0.7}
  AI_CPU_MODELS: ${AI_CPU_MODELS:-bge-m3}

x-bao-sync-env: &bao-sync-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bms-dev}
  ACTIONS_DB_PASSWORD: ${ACTIONS_DB_PASSWORD:-actions-db-dev}
  HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD:-hasura-db-dev}
  KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-db-dev}
  FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:-flowable-db-dev}
  CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc-db-dev}
  LAKEHOUSE_DB_PASSWORD: ${LAKEHOUSE_DB_PASSWORD:-lakehouse-db-dev}
  DEBEZIUM_KAFKA_PASSWORD: ${DEBEZIUM_KAFKA_PASSWORD:-debezium-kafka-dev}
  LAKEHOUSE_KAFKA_PASSWORD: ${LAKEHOUSE_KAFKA_PASSWORD:-lakehouse-kafka-dev}
  KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-kcadmin}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin-dev}
  FLOWABLE_ADMIN: ${FLOWABLE_ADMIN:-rest-admin}
  FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-test}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}

x-actions-image: &actions-image
  build:
    context: .
    dockerfile: docker/python.Dockerfile
    args:
      APP_DIR: services/actions
  image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-actions:${BAMBOO_TAG:-dev}

x-hasura-env: &hasura-env
  HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-dev-admin-secret}
  HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_ENABLE_CONSOLE:-true}
  HASURA_GRAPHQL_CORS_DOMAIN: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173}
  HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log
  ACTIONS_SECRET: ${ACTIONS_SECRET:-dev-actions-secret}
  HASURA_GRAPHQL_AUTH_HOOK_MODE: GET

services:
  db:
    logging: *logging
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bms-dev}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10",
              "-c", "max_slot_wal_keep_size=1GB", "-c", "jit=off"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bms -d bms"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    logging: *logging
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-migrate:${BAMBOO_TAG:-dev}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      EXTRA_DATABASES: flowable keycloak hasura_meta hasura_meta_test bms_hasura_test lakehouse
      SERVICE_DATABASES: keycloak:bamboo_keycloak flowable:bamboo_flowable hasura_meta:bamboo_hasura hasura_meta_test:bamboo_hasura lakehouse:bamboo_lakehouse
      HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD:-hasura-db-dev}
      ACTIONS_DB_PASSWORD: ${ACTIONS_DB_PASSWORD:-actions-db-dev}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-db-dev}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:-flowable-db-dev}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc-db-dev}
      LAKEHOUSE_DB_PASSWORD: ${LAKEHOUSE_DB_PASSWORD:-lakehouse-db-dev}
    restart: "no"

  seed:
    logging: *logging
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        APP_DIR: services/seed
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-seed:${BAMBOO_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://bms:${POSTGRES_PASSWORD:-bms-dev}@db:5432/bms
      SEED_DEMO: ${SEED_DEMO:-true}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-kcadmin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin-dev}
    command: ["python", "-m", "app.seed"]
    restart: "no"

  keycloak:
    logging: *logging
    build:
      context: ./platform/keycloak
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-keycloak:${BAMBOO_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["${KEYCLOAK_MODE:-start-dev}", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: bamboo_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-db-dev}
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8000}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://localhost:8080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_HEAP:--Xms64m -Xmx512m}
      MALLOC_ARENA_MAX: "2"
      KC_DB_POOL_MAX_SIZE: ${KEYCLOAK_DB_POOL:-20}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin-dev}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8000}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  flowable:
    logging: *logging
    image: flowable/flowable-rest:8.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flowable
      SPRING_DATASOURCE_USERNAME: bamboo_flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD:-flowable-db-dev}
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      FLOWABLE_REST_APP_ADMIN_USER_ID: ${FLOWABLE_ADMIN:-rest-admin}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-test}
      JAVA_OPTS: ${FLOWABLE_JAVA_OPTS:--Xms64m -Xmx512m}
      MALLOC_ARENA_MAX: "2"
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  hasura:
    logging: *logging
    image: hasura/graphql-engine:v2.51.0-ce
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *hasura-env
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://bamboo_hasura:${HASURA_DB_PASSWORD:-hasura-db-dev}@db:5432/hasura_meta
      BMS_DATABASE_URL: postgres://bamboo_hasura:${HASURA_DB_PASSWORD:-hasura-db-dev}@db:5432/bms
      ACTIONS_URL: http://actions:8000
      HASURA_GRAPHQL_AUTH_HOOK: http://actions:8000/auth/hasura
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q OK <&3"]
      interval: 3s
      timeout: 3s
      retries: 60

  openbao:
    logging: *logging
    build:
      context: ./platform/openbao
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-openbao:${BAMBOO_TAG:-dev}
    command: ["server"]
    volumes:
      - openbao-data:/openbao/file
    ports:
      - "127.0.0.1:8200:8200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbycode=200'"]
      interval: 2s
      timeout: 3s
      retries: 30

  openbao-init:
    logging: *logging
    <<: *actions-image
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      <<: [*actions-env, *bao-sync-env]
      BAO_APPROLE_FILE: ""
      BAO_KEYS_FILE: /openbao/keys/init.json
      APPROLE_UID: "10001"
      APPROLE_OUTPUTS: actions=/run/bms-actions/approle.json,bootstrap=/run/bms-bootstrap/approle.json,search=/run/bms-search/approle.json,lakehouse=/run/bms-lakehouse/approle.json
      S3_CONFIG_PATH: /etc/bms/s3.json
      MEILI_CONFIG_PATH: /etc/meilisearch/config.toml
      TRINO_CATALOG_PATH: /etc/trino/bms-catalog/lakehouse.properties
      TRINO_UID: "1000"
      TRINO_SECRETS_DIR: /etc/trino/secrets
      INTERNAL_CA_OUTPUTS: /run/bms-actions/trino-ca.pem
    command: ["python", "-m", "app.openbao_init"]
    user: "0"
    volumes:
      - openbao-keys:/openbao/keys
      - actions-secrets:/run/bms-actions
      - bootstrap-secrets:/run/bms-bootstrap
      - search-secrets:/run/bms-search
      - lakehouse-secrets:/run/bms-lakehouse
      - seaweedfs-config:/etc/bms
      - meilisearch-config:/etc/meilisearch
      - trino-catalog:/etc/trino/bms-catalog
      - trino-secrets:/etc/trino/secrets
    restart: "no"

  seaweedfs:
    logging: *logging
    image: chrislusf/seaweedfs:4.48
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=256 -volume.max=64 -filer
      -s3 -s3.port=8333 -s3.config=/etc/bms/s3.json -s3.allowedOrigins=${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173}
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-config:/etc/bms:ro
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8888:8888"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333 && { [ ! /etc/bms/s3.json -nt /tmp/s3.json.loaded ] || { touch /tmp/s3.json.loaded && kill -HUP 1; }; }"]
      interval: 3s
      timeout: 3s
      retries: 40

  mailpit:
    logging: *logging
    image: axllent/mailpit:v1.27
    # Hộp thư thử cho môi trường phát triển; đặt SMTP_HOST tới máy chủ thật khi triển khai (UI tại localhost:8025)
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  backup:
    logging: *logging
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    # Sao lưu CSDL theo lịch rồi diễn tập khôi phục ngay bản vừa tạo (kết quả ghi vào audit.backup_run)
    entrypoint: ["bash", "/ops/backup-scheduler.sh"]
    environment:
      PGHOST: db
      PGUSER: bms
      PGPASSWORD: ${POSTGRES_PASSWORD:-bms-dev}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_FIRST_DELAY: ${BACKUP_FIRST_DELAY:-600}
    volumes:
      - ./scripts/ops:/ops:ro
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  vector:
    logging: *logging
    profiles: [logs]
    image: timberio/vector:0.46.1-debian
    # Gom log của mọi container về obs.log_event qua actions (/obs/ingest); cần đọc socket Docker
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      ACTIONS_SECRET: ${ACTIONS_SECRET:-dev-actions-secret}
    volumes:
      - ./platform/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - actions
    restart: unless-stopped

  clamav:
    logging: *logging
    profiles: [scan]
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"

  actions:
    logging: *logging
    <<: *actions-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
    environment:
      <<: *actions-env
      SLEEPER_URL: http://sleeper:9000
    volumes:
      - actions-secrets:/run/bms:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8090:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40

  flow-sync:
    logging: *logging
    <<: *actions-image
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment: *actions-env
    volumes:
      - actions-secrets:/run/bms:ro
    command: ["python", "-m", "app.flow_sync"]
    restart: unless-stopped

  bootstrap:
    logging: *logging
    <<: *actions-image
    depends_on:
      flowable:
        condition: service_healthy
      hasura:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    environment:
      <<: *actions-env
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://localhost:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}
    volumes:
      - bootstrap-secrets:/run/bms:ro
    command: ["python", "-m", "app.bootstrap"]
    restart: "no"

  meilisearch:
    logging: *logging
    image: getmeili/meilisearch:v1.54.3
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    command: ["/bin/meilisearch", "--config-file-path", "/etc/meilisearch/config.toml"]
    environment:
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-512 MiB}
    volumes:
      - meilisearch-data:/meili_data
      - meilisearch-config:/etc/meilisearch:ro
    ports:
      - "127.0.0.1:7700:7700"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Ba dịch vụ -core dùng thưa nên ngủ khi nhàn rỗi; tên mạng cũ (tika, gotenberg, trino) và cổng công bố thuộc `sleeper` (ADR #53)
  tika-core:
    logging: *logging
    image: apache/tika:4.1.0-1
    environment:
      JAVA_TOOL_OPTIONS: ${TIKA_JAVA_OPTS:--Xmx512m}
      MALLOC_ARENA_MAX: "2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998 && printf 'GET /version HTTP/1.0\r\n\r\n' >&3 && grep -q Tika <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  gotenberg-core:
    logging: *logging
    image: gotenberg/gotenberg:8.37.0-chromium
    command: ["gotenberg", "--chromium-auto-start", "--chromium-disable-javascript", "--chromium-deny-private-ips",
              "--chromium-deny-public-ips", "--api-disable-download-from", "--webhook-disable", "--api-timeout=60s"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  search-sync:
    logging: *logging
    <<: *actions-image
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      sleeper:
        condition: service_healthy
    environment: *actions-env
    volumes:
      - search-secrets:/run/bms:ro
    command: ["python", "-m", "app.search_sync"]
    restart: unless-stopped

  # Ollama và OCR ngủ khi nhàn rỗi như các dịch vụ -core khác: tên mạng `ollama`, `ocr` và cổng công bố thuộc `sleeper`
  ollama-core:
    logging: *logging
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: ${AI_KEEP_ALIVE:-5m}
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: ${AI_KV_CACHE_TYPE:-q8_0}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-bge-m3}
    # Sau khi máy chủ lên, đọc tệp hai mô hình mặc định vào page cache của hệ điều hành (không nạp lên RAM tiến trình
    # hay VRAM, kernel tự thu hồi khi cần): lượt hỏi đầu tiên không phải đọc ~3,3 GB từ đĩa (ADR #52).
    entrypoint:
      - sh
      - -c
      - |
        (until ollama list > /dev/null 2>&1; do sleep 1; done
        for m in "$$AI_CHAT_MODEL" "$$AI_EMBED_MODEL"; do
          ollama show --modelfile "$$m" 2> /dev/null | sed -n 's/^FROM \(\/.*\)/\1/p' | xargs -r cat > /dev/null
        done) &
        exec ollama serve
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    logging: *logging
    image: ollama/ollama:0.35.1
    depends_on:
      ollama-core:
        condition: service_healthy
      sleeper:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-bge-m3}
    entrypoint: ["sh", "-c", "for m in \"$$AI_CHAT_MODEL\" \"$$AI_EMBED_MODEL\"; do ollama show \"$$m\" > /dev/null 2>&1 || ollama pull \"$$m\" || echo \"CẢNH BÁO: không tải được mô hình $$m, AI chưa dùng được\" >&2; done"]
    restart: "no"

  ocr-core:
    logging: *logging
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-ocr:${BAMBOO_TAG:-dev}
    depends_on:
      ocr-init:
        condition: service_completed_successfully
    environment:
      HF_HUB_OFFLINE: "1"
      OCR_IDLE_SECONDS: ${OCR_IDLE_SECONDS:-300}
    volumes:
      - ocr-models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  ocr-init:
    logging: *logging
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-ocr:${BAMBOO_TAG:-dev}
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
    volumes:
      - ocr-models:/models
    command: ["python", "-m", "app.download"]
    restart: "no"

  ai-worker:
    logging: *logging
    <<: *actions-image
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
      ocr-core:
        condition: service_started
      sleeper:
        condition: service_healthy
    environment:
      <<: *actions-env
      OCR_URL: http://ocr:8000
      SLEEPER_URL: http://sleeper:9000
    volumes:
      - actions-secrets:/run/bms:ro
    command: ["python", "-m", "app.ai_worker"]
    restart: unless-stopped

  kafka:
    logging: *logging
    build:
      context: ./platform/kafka
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-kafka:${BAMBOO_TAG:-dev}
    environment:
      CLUSTER_ID: b5T4hzPsQrOmfv9Kr38lIg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,HOST://:19092,CONTROLLER://localhost:9093,LOCAL://localhost:9094
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,HOST://localhost:19092,LOCAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: LOCAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,HOST:SASL_PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP:--Xms128m -Xmx512m}
      KAFKA_JVM_PERFORMANCE_OPTS: -server -XX:+UseSerialGC -XX:ReservedCodeCacheSize=96m -Djava.awt.headless=true
      MALLOC_ARENA_MAX: "2"
      DEBEZIUM_KAFKA_PASSWORD: ${DEBEZIUM_KAFKA_PASSWORD:-debezium-kafka-dev}
      LAKEHOUSE_KAFKA_PASSWORD: ${LAKEHOUSE_KAFKA_PASSWORD:-lakehouse-kafka-dev}
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bamboo-kafka-ready && /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 15s

  debezium:
    logging: *logging
    image: quay.io/debezium/server:3.7.0.Final
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      DEBEZIUM_SINK_TYPE: kafka
      DEBEZIUM_SINK_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:9092
      DEBEZIUM_SINK_KAFKA_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      DEBEZIUM_SINK_KAFKA_PRODUCER_SASL_MECHANISM: SCRAM-SHA-512
      DEBEZIUM_SINK_KAFKA_PRODUCER_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="debezium" password="${DEBEZIUM_KAFKA_PASSWORD:-debezium-kafka-dev}";
      DEBEZIUM_SINK_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      DEBEZIUM_SINK_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      DEBEZIUM_SOURCE_CONNECTOR_CLASS: io.debezium.connector.postgresql.PostgresConnector
      DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME: /debezium/data/offsets.dat
      DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS: 5000
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: db
      DEBEZIUM_SOURCE_DATABASE_PORT: 5432
      DEBEZIUM_SOURCE_DATABASE_USER: bamboo_cdc
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${CDC_DB_PASSWORD:-cdc-db-dev}
      DEBEZIUM_SOURCE_DATABASE_DBNAME: bms
      DEBEZIUM_SOURCE_TOPIC_PREFIX: bms
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
      DEBEZIUM_SOURCE_PUBLICATION_NAME: bms_cdc
      DEBEZIUM_SOURCE_PUBLICATION_AUTOCREATE_MODE: disabled
      DEBEZIUM_SOURCE_SLOT_NAME: bms_debezium
      DEBEZIUM_SOURCE_SCHEMA_INCLUDE_LIST: core,mdm,wf,proc,ic,mfg,collab,cdc
      DEBEZIUM_SOURCE_COLUMN_EXCLUDE_LIST: core.attachment_ocr.page_texts
      DEBEZIUM_SOURCE_HEARTBEAT_INTERVAL_MS: 10000
      DEBEZIUM_SOURCE_HEARTBEAT_ACTION_QUERY: UPDATE cdc.heartbeat SET beat_at = now() WHERE id = 1
      DEBEZIUM_SOURCE_DECIMAL_HANDLING_MODE: string
      # mô-đun Dữ liệu số tắt lâu làm mất slot (max_slot_wal_keep_size): bật lại thì chụp lại toàn bộ (ADR #56)
      DEBEZIUM_SOURCE_SNAPSHOT_MODE: when_needed
      DEBEZIUM_FORMAT_KEY: json
      DEBEZIUM_FORMAT_VALUE: json
      DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE: "false"
      DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE: "false"
      JAVA_OPTS: ${DEBEZIUM_JAVA_OPTS:--Xms64m -Xmx384m}
      MALLOC_ARENA_MAX: "2"
    volumes:
      - debezium-data:/debezium/data
    ports:
      - "127.0.0.1:8083:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /q/health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  lakehouse-sink:
    logging: *logging
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        APP_DIR: services/actions
        REQUIREMENTS: requirements-lakehouse.txt
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-lakehouse:${BAMBOO_TAG:-dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      <<: *actions-env
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - lakehouse-secrets:/run/bms:ro
    command: ["python", "-m", "app.lakehouse_sink"]
    restart: unless-stopped

  trino-core:
    logging: *logging
    build:
      context: ./platform/trino
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-trino:${BAMBOO_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    volumes:
      - trino-catalog:/etc/trino/bms-catalog:ro
      - trino-secrets:/etc/trino/secrets:ro
    environment:
      MALLOC_ARENA_MAX: "2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  trino-init:
    logging: *logging
    build:
      context: ./platform/trino
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-trino:${BAMBOO_TAG:-dev}
    depends_on:
      sleeper:
        condition: service_healthy
    volumes:
      - trino-secrets:/etc/trino/secrets:ro
    entrypoint: ["bash", "-c", "TRINO_PASSWORD=$$(cat /etc/trino/secrets/admin.password) exec trino --server https://trino:8443 --truststore-path /etc/trino/secrets/ca.pem --user bms-admin --password --file /etc/trino/bms/silver.sql"]
    restart: "no"

  sleeper:
    logging: *logging
    build:
      context: .
      dockerfile: services/sleeper/Dockerfile
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-sleeper:${BAMBOO_TAG:-dev}
    depends_on:
      trino-core:
        condition: service_started
      tika-core:
        condition: service_started
      gotenberg-core:
        condition: service_started
    environment:
      SLEEPER_PROJECT: bamboo
      SLEEPER_IDLE_SECONDS: ${SLEEPER_IDLE_SECONDS:-300}
      SLEEPER_TARGETS: 8443=trino-core:8443,9998=tika-core:9998,3000=gotenberg-core:3000,11434=ollama-core:11434,8000=ocr-core:8000
      # Mô-đun chức năng (ADR #56): dừng container của mô-đun chưa cài, chạy container của mô-đun đã cài.
      # Danh sách phải khớp services/actions/app/modules.py (MANAGED_SERVICES; kiểm bởi test_mo_dun.py)
      SLEEPER_MODULES_URL: http://actions:8000/modules/services
      SLEEPER_HOLD_UNTIL: bootstrap
      SLEEPER_MANAGED: flowable,kafka,debezium,lakehouse-sink,trino-core,meilisearch,search-sync,tika-core,ollama-core,ocr-core,ai-worker
    networks:
      default:
        aliases: [trino, tika, gotenberg, ollama, ocr]
    # Docker API tương đương quyền root trên máy chủ: chỉ sleeper được gắn, và nó chỉ start/stop container thuộc SLEEPER_TARGETS
    user: "0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8085:8443"
      - "127.0.0.1:9998:9998"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:11434:11434"
      - "127.0.0.1:8866:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    logging: *logging
    build:
      context: ./platform/apisix
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-gateway:${BAMBOO_TAG:-dev}
    environment:
      APISIX_WORKER_PROCESSES: ${GATEWAY_WORKERS:-2}
    depends_on:
      web:
        condition: service_started
      hasura:
        condition: service_started
      keycloak:
        condition: service_started
      seaweedfs:
        condition: service_started
      actions:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:9080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q ok <&3"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    logging: *logging
    build:
      context: ./apps/web
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-web:${BAMBOO_TAG:-dev}
    environment:
      BAMBOO_KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8000}
      BAMBOO_HASURA_URL: ${HASURA_PUBLIC_URL:-http://localhost:8000/graphql}
      BAMBOO_SETUP_URL: ${WEB_ORIGIN:-http://localhost:8000}/setup
      BAMBOO_EXT_URL: ${WEB_ORIGIN:-http://localhost:8000}/ext
    ports:
      - "127.0.0.1:8088:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  hasura-test:
    logging: *logging
    profiles: [test]
    image: hasura/graphql-engine:v2.51.0-ce
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *hasura-env
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://bamboo_hasura:${HASURA_DB_PASSWORD:-hasura-db-dev}@db:5432/hasura_meta_test
      BMS_DATABASE_URL: postgres://bamboo_hasura:${HASURA_DB_PASSWORD:-hasura-db-dev}@db:5432/bms_hasura_test
      ACTIONS_URL: http://bamboo-actions-test:8090
      HASURA_GRAPHQL_AUTH_HOOK: http://bamboo-actions-test:8090/auth/hasura

  actions-test:
    logging: *logging
    profiles: [test]
    <<: *actions-image
    depends_on:
      hasura-test:
        condition: service_started
      flowable:
        condition: service_started
      seaweedfs:
        condition: service_started
      meilisearch:
        condition: service_started
      sleeper:
        condition: service_healthy
      debezium:
        condition: service_started
      lakehouse-sink:
        condition: service_started
      trino-init:
        condition: service_completed_successfully
    environment:
      <<: *actions-env
      S3_PUBLIC_ENDPOINT: http://seaweedfs:8333
      BAO_KEYS_FILE: /openbao/keys/init.json
      TEST_DATABASE_URL: postgresql://bms:${POSTGRES_PASSWORD:-bms-dev}@db:5432/bms_hasura_test
      TEST_APP_DATABASE_URL: postgresql://bamboo_actions:${ACTIONS_DB_PASSWORD:-actions-db-dev}@db:5432/bms_hasura_test
      HASURA_URL: http://hasura-test:8080
      ACTIONS_PORT: "8090"
      REQUIRE_SERVICES: "1"
    volumes:
      - ./:/repo
      - actions-secrets:/run/bms:ro
      - openbao-keys:/openbao/keys:ro
    user: "0"
    entrypoint: ["sh", "-c", "pip install -q -r requirements-dev.txt -c /repo/constraints.txt && python -m pytest -q \"$$@\"", "--"]

volumes:
  backups:
  pgdata:
  seaweedfs-data:
  seaweedfs-config:
  openbao-data:
  openbao-keys:
  actions-secrets:
  bootstrap-secrets:
  search-secrets:
  meilisearch-data:
  meilisearch-config:
  kafka-data:
  debezium-data:
  lakehouse-secrets:
  trino-catalog:
  trino-secrets:
  ollama-models:
  ocr-models:
