# Toàn bộ hệ thống (lõi + giao diện) chạy bằng một lệnh `docker compose up -d` (ADR #13), build image từ
# mã nguồn. Không cần mã nguồn: dùng image dựng sẵn trên GHCR (compose.release.yml, xem README).
# Kiểm thử tích hợp: `make test-actions` (profile test: Hasura riêng trỏ vào bms_hasura_test).
name: bamboo

# Xoay vòng log của mọi container (mặc định json-file không giới hạn, có thể làm đầy đĩa).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-env: &db-env
  PGHOST: db
  PGUSER: bms
  PGPASSWORD: ${POSTGRES_PASSWORD:-bms-dev}

x-actions-env: &actions-env
  # production: từ chối khởi động nếu còn mật khẩu/secret mặc định của môi trường dev.
  BAMBOO_ENV: ${BAMBOO_ENV:-development}
  # Tài khoản ứng dụng đặc quyền tối thiểu (ADR #35); không phải superuser `bms`.
  DATABASE_URL: postgresql://bamboo_actions:${ACTIONS_DB_PASSWORD:-actions-db-dev}@db:5432/bms
  ACTIONS_SECRET: ${ACTIONS_SECRET:-dev-actions-secret}
  FLOWABLE_URL: http://flowable:8080/flowable-rest/service
  FLOWABLE_USER: ${FLOWABLE_ADMIN:-rest-admin}
  FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-test}
  HASURA_URL: http://hasura:8080
  HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-dev-admin-secret}
  # Webhook lấy JWKS qua mạng nội bộ; issuer là URL trình duyệt thấy (KC_HOSTNAME, qua cổng API).
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/bms/protocol/openid-connect/certs
  KEYCLOAK_ISSUER: ${KEYCLOAK_URL:-http://localhost:8000}/realms/bms
  # Tệp đính kèm (ADR #26). Link có chữ ký dùng địa chỉ trình duyệt thấy.
  S3_ENDPOINT: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8000}
  # Secret (CSDL, Flowable, khóa S3, actions) đọc từ OpenBao bằng AppRole của từng dịch vụ (ADR #25);
  # giá trị env ở trên chỉ là dự phòng khi chạy ngoài compose.
  BAO_ADDR: http://openbao:8200
  BAO_APPROLE_FILE: /run/bms/approle.json
  # Bỏ trống: chưa quét virus. Bật ClamAV: `docker compose --profile scan up -d` và CLAMAV_HOST=clamav.
  CLAMAV_HOST: ${CLAMAV_HOST:-}

# Secret hạ tầng openbao-init chép vào OpenBao (môi trường dev khai báo ở .env).
x-bao-sync-env: &bao-sync-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bms-dev}
  ACTIONS_DB_PASSWORD: ${ACTIONS_DB_PASSWORD:-actions-db-dev}
  HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD:-hasura-db-dev}
  KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-db-dev}
  FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:-flowable-db-dev}
  CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc-db-dev}
  LAKEHOUSE_DB_PASSWORD: ${LAKEHOUSE_DB_PASSWORD:-lakehouse-db-dev}
  KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-kcadmin}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin-dev}
  FLOWABLE_ADMIN: ${FLOWABLE_ADMIN:-rest-admin}
  FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-test}
  # Không chép vào OpenBao; chỉ để openbao-init kiểm tra khi BAMBOO_ENV=production.
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}

x-actions-image: &actions-image
  build:
    context: .
    dockerfile: docker/python.Dockerfile
    args:
      APP_DIR: services/actions
  image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-actions:${BAMBOO_TAG:-dev}

x-hasura-env: &hasura-env
  HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-dev-admin-secret}
  # Production: HASURA_ENABLE_CONSOLE=false (quản trị bằng metadata trong Git, ADR #24).
  HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_ENABLE_CONSOLE:-true}
  # Chỉ ứng dụng web (qua cổng API) và dev server `npm run dev` được gọi GraphQL từ trình duyệt.
  HASURA_GRAPHQL_CORS_DOMAIN: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173}
  HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log
  ACTIONS_SECRET: ${ACTIONS_SECRET:-dev-actions-secret}
  # Xác thực bằng webhook (ADR #32): token Keycloak + tenant đã chọn (header x-bamboo-tenant).
  HASURA_GRAPHQL_AUTH_HOOK_MODE: GET

services:
  db:
    logging: *logging
    image: postgis/postgis:17-3.5
    # Image PostGIS chỉ có bản amd64; máy arm64 (Mac chip M) chạy qua giả lập, các image khác chạy native.
    platform: linux/amd64
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bms-dev}
    # WAL logic cho CDC (ADR #38). Slot của Debezium giữ WAL tối đa 1 GB khi Debezium dừng lâu; vượt mức
    # thì slot bị vô hiệu (Debezium chụp ảnh lại) thay vì làm đầy đĩa của CSDL.
    # jit=off: câu GraphQL của Hasura là một câu SQL lớn, ước lượng chi phí cao dễ kích hoạt JIT; biên dịch JIT
    # tốn hàng trăm ms CPU cho truy vấn chỉ chạy vài ms (khuyến nghị của Hasura cho tải OLTP).
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10",
              "-c", "max_slot_wal_keep_size=1GB", "-c", "jit=off"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # Kiểm tra qua TCP: lúc khởi tạo volume mới, image chạy một server tạm chỉ nghe unix socket
      # rồi khởi động lại; kiểm tra qua socket sẽ báo sẵn sàng quá sớm.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bms -d bms"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Tạo database phụ, chạy các migration chưa chạy, đặt tài khoản đặc quyền tối thiểu cho từng dịch vụ
  # (ADR #35, db/roles) rồi thoát. Chỉ job này và seed dùng superuser `bms`.
  migrate:
    logging: *logging
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-migrate:${BAMBOO_TAG:-dev}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      EXTRA_DATABASES: flowable keycloak hasura_meta hasura_meta_test bms_hasura_test lakehouse
      SERVICE_DATABASES: keycloak:bamboo_keycloak flowable:bamboo_flowable hasura_meta:bamboo_hasura hasura_meta_test:bamboo_hasura lakehouse:bamboo_lakehouse
      HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD:-hasura-db-dev}
      ACTIONS_DB_PASSWORD: ${ACTIONS_DB_PASSWORD:-actions-db-dev}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-db-dev}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:-flowable-db-dev}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc-db-dev}
      LAKEHOUSE_DB_PASSWORD: ${LAKEHOUSE_DB_PASSWORD:-lakehouse-db-dev}
    restart: "no"

  # Dữ liệu demo Tập đoàn X (ADR #16): bỏ qua nếu đã có, tắt bằng SEED_DEMO=false.
  seed:
    logging: *logging
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        APP_DIR: services/seed
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-seed:${BAMBOO_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://bms:${POSTGRES_PASSWORD:-bms-dev}@db:5432/bms
      SEED_DEMO: ${SEED_DEMO:-true}
    command: ["python", "-m", "app.seed"]
    restart: "no"

  # Chỉ xác thực (ADR #6, #32). Realm sinh bằng `make realm`, đóng gói vào image, import lần đầu.
  keycloak:
    logging: *logging
    build:
      context: ./platform/keycloak
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-keycloak:${BAMBOO_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # start-dev cho máy dev; production: KEYCLOAK_MODE=start sau reverse proxy TLS (docs/van-hanh).
    command: ["${KEYCLOAK_MODE:-start-dev}", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: bamboo_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-db-dev}
      # Địa chỉ trình duyệt thấy (qua cổng API); phải khớp issuer mà actions kiểm tra và cấu hình của web.
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8000}
      # Trang quản trị không đi qua cổng công khai (cổng chặn realm master): dùng cổng riêng 127.0.0.1:8080.
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://localhost:8080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Mặc định trong container Keycloak lấy heap ban đầu 50%, tối đa 70% RAM (container không giới hạn bộ nhớ
      # thì là RAM của cả máy). Một realm vài chục người dùng chỉ cần vài trăm MB.
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_HEAP:--Xms128m -Xmx768m}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin-dev}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}
      # Redirect URI của client bms-web khi import realm (platform/keycloak/realm).
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8000}
    # Chỉ dành cho trang quản trị Keycloak; người dùng đăng nhập qua cổng API.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # Image không có curl: hỏi cổng quản trị 9000 bằng /dev/tcp của bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  flowable:
    logging: *logging
    image: flowable/flowable-rest:8.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flowable
      SPRING_DATASOURCE_USERNAME: bamboo_flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD:-flowable-db-dev}
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      FLOWABLE_REST_APP_ADMIN_USER_ID: ${FLOWABLE_ADMIN:-rest-admin}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-test}
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped
    # Image dựng trên Alpine (không có bash, image tự đặt -Xmx512M): dùng nc của busybox.
    # Tomcat chỉ mở cổng sau khi Spring khởi động xong.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  hasura:
    logging: *logging
    image: hasura/graphql-engine:v2.51.0-ce
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *hasura-env
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://bamboo_hasura:${HASURA_DB_PASSWORD:-hasura-db-dev}@db:5432/hasura_meta
      BMS_DATABASE_URL: postgres://bamboo_hasura:${HASURA_DB_PASSWORD:-hasura-db-dev}@db:5432/bms
      ACTIONS_URL: http://actions:8000
      HASURA_GRAPHQL_AUTH_HOOK: http://actions:8000/auth/hasura
    # Chỉ dành cho Hasura Console và công cụ quản trị trên máy dev; ứng dụng gọi qua cổng API (/graphql).
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q OK <&3"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Két secret lưu bền (raft một node, ADR #2, #25). Khởi động lại thì sealed tới khi openbao-init chạy lại.
  openbao:
    logging: *logging
    build:
      context: ./platform/openbao
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-openbao:${BAMBOO_TAG:-dev}
    # Entrypoint của image tự thêm -config=/openbao/config.
    command: ["server"]
    volumes:
      - openbao-data:/openbao/file
    ports:
      - "127.0.0.1:8200:8200"
    restart: unless-stopped
    # Sẵn sàng nhận lệnh (kể cả khi chưa khởi tạo hoặc đang sealed: openbao-init lo phần đó).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbycode=200'"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Khởi tạo/unseal, policy, AppRole, đồng bộ secret từ .env, sinh khóa S3; ghi s3.json cho SeaweedFS
  # và file AppRole vào volume riêng của từng dịch vụ (dịch vụ này không thấy secret của dịch vụ kia).
  openbao-init:
    logging: *logging
    <<: *actions-image
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      <<: [*actions-env, *bao-sync-env]
      BAO_APPROLE_FILE: ""
      BAO_KEYS_FILE: /openbao/keys/init.json
      # File AppRole thuộc người dùng chạy dịch vụ (uid 10001 trong image Python).
      APPROLE_UID: "10001"
      APPROLE_OUTPUTS: actions=/run/bms-actions/approle.json,bootstrap=/run/bms-bootstrap/approle.json,search=/run/bms-search/approle.json,lakehouse=/run/bms-lakehouse/approle.json
      S3_CONFIG_PATH: /etc/bms/s3.json
      # Khóa chủ Meilisearch do OpenBao sinh, ghi vào tệp cấu hình (ADR #36).
      MEILI_CONFIG_PATH: /etc/meilisearch/config.toml
      # Catalog Iceberg của Trino (mật khẩu CSDL lakehouse, khóa S3), thuộc uid 1000 của image Trino (ADR #40).
      TRINO_CATALOG_PATH: /etc/trino/bms-catalog/lakehouse.properties
      TRINO_UID: "1000"
    command: ["python", "-m", "app.openbao_init"]
    # Ghi vào các volume secret (sở hữu bởi root).
    user: "0"
    volumes:
      - openbao-keys:/openbao/keys
      - actions-secrets:/run/bms-actions
      - bootstrap-secrets:/run/bms-bootstrap
      - search-secrets:/run/bms-search
      - lakehouse-secrets:/run/bms-lakehouse
      - seaweedfs-config:/etc/bms
      - meilisearch-config:/etc/meilisearch
      - trino-catalog:/etc/trino/bms-catalog
    restart: "no"

  # Lưu trữ đối tượng S3 (ADR #2, #26). Không cho truy cập ẩn danh; CORS cho ứng dụng Refine.
  seaweedfs:
    logging: *logging
    image: chrislusf/seaweedfs:4.48
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=256 -volume.max=32 -filer
      -s3 -s3.port=8333 -s3.config=/etc/bms/s3.json -s3.allowedOrigins=${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173}
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-config:/etc/bms:ro
    # Không mở cổng ra ngoài: trình duyệt tải tệp qua cổng API (/bms-quarantine, /bms-documents).
    restart: unless-stopped
    # Healthcheck còn nạp lại định danh S3 (SIGHUP cho weed, PID 1) khi openbao-init ghi s3.json mới,
    # ví dụ khi nâng cấp thêm định danh: không phải khởi động lại SeaweedFS.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333 && { [ ! /etc/bms/s3.json -nt /tmp/s3.json.loaded ] || { touch /tmp/s3.json.loaded && kill -HUP 1; }; }"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Quét virus cho tệp đính kèm (tùy chọn, cần khoảng 1,5 GB RAM, tải chữ ký lần đầu mất vài phút).
  clamav:
    logging: *logging
    profiles: [scan]
    image: clamav/clamav:1.4

  # Hasura Actions bọc hàm CSDL.
  actions:
    logging: *logging
    <<: *actions-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
    environment: *actions-env
    volumes:
      - actions-secrets:/run/bms:ro
    # Không ghi access log: mỗi request GraphQL gọi /auth/gateway và /auth/hasura (hai dòng log mỗi request);
    # Hasura (http-log, webhook-log) và cổng API đã ghi nhật ký truy cập.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Đối chiếu CSDL → Flowable (ADR #31); chạy wf.refresh_all() mỗi phút.
  flow-sync:
    logging: *logging
    <<: *actions-image
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment: *actions-env
    volumes:
      - actions-secrets:/run/bms:ro
    command: ["python", "-m", "app.flow_sync"]
    restart: unless-stopped

  # Tạo bucket S3, deploy BPMN, nạp metadata Hasura, đồng bộ client Keycloak rồi thoát.
  bootstrap:
    logging: *logging
    <<: *actions-image
    depends_on:
      flowable:
        condition: service_healthy
      hasura:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    environment:
      <<: *actions-env
      # Bổ sung địa chỉ ứng dụng vào redirect URI của client bms-web nếu thiếu (realm chỉ import
      # ở lần chạy đầu; đổi WEB_ORIGIN hoặc nâng cấp từ 0.1.0 vẫn đăng nhập được, không mất dữ liệu).
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8000}
      # Tài khoản demo mới (ví dụ chuyên viên nhân sự) thêm vào realm đã có, cùng mật khẩu với lần import đầu.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}
    volumes:
      - bootstrap-secrets:/run/bms:ro
    command: ["python", "-m", "app.bootstrap"]
    restart: "no"

  # Tìm kiếm toàn văn (ADR #36): chỉ mục Meilisearch bản Community (MIT, image không có hậu tố -enterprise).
  # Chỉ mạng nội bộ; giao diện tìm qua Action search_documents. Khóa chủ trong tệp cấu hình do openbao-init ghi.
  meilisearch:
    logging: *logging
    image: getmeili/meilisearch:v1.54.3
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    command: ["/bin/meilisearch", "--config-file-path", "/etc/meilisearch/config.toml"]
    volumes:
      - meilisearch-data:/meili_data
      - meilisearch-config:/etc/meilisearch:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Trích chữ từ tệp đính kèm (PDF, DOCX, XLSX) cho chỉ mục tìm kiếm. Chỉ search-sync gọi, không mở cổng.
  tika:
    logging: *logging
    image: apache/tika:4.1.0-1
    # JVM mặc định lấy tối đa 1/4 RAM máy cho cả tiến trình chính và tiến trình con Tika tự fork (biến
    # JAVA_TOOL_OPTIONS áp cho cả hai). Tệp đính kèm giới hạn kích thước nên 512 MB đủ.
    environment:
      JAVA_TOOL_OPTIONS: ${TIKA_JAVA_OPTS:--Xmx512m}
    restart: unless-stopped
    # Image không có curl: hỏi /version bằng /dev/tcp của bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998 && printf 'GET /version HTTP/1.0\r\n\r\n' >&3 && grep -q Tika <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # In phiếu PDF (ADR #37): Chromium của Gotenberg chuyển HTML do actions sinh sang PDF. Chỉ actions gọi, không
  # mở cổng. Trang không cần tải gì từ ngoài: tắt JavaScript, chặn mọi địa chỉ mạng (riêng và công khai) và
  # tính năng tải tệp từ URL, webhook (chống SSRF).
  gotenberg:
    logging: *logging
    image: gotenberg/gotenberg:8.37.0-chromium
    command: ["gotenberg", "--chromium-auto-start", "--chromium-disable-javascript", "--chromium-deny-private-ips",
              "--chromium-deny-public-ips", "--api-disable-download-from", "--webhook-disable", "--api-timeout=60s"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Đồng bộ CSDL → chỉ mục (ADR #36): nghe kênh search_sync, đọc tệp đã kiểm tra, trích chữ bằng Tika.
  search-sync:
    logging: *logging
    <<: *actions-image
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      tika:
        condition: service_started
    environment: *actions-env
    volumes:
      - search-secrets:/run/bms:ro
    command: ["python", "-m", "app.search_sync"]
    restart: unless-stopped

  # Trục sự kiện (ADR #2, #38): Kafka KRaft một node, chỉ mạng nội bộ, không xác thực (chưa có dịch vụ nào
  # ngoài Debezium ghi vào; SASL/ACL khi mở cho ứng dụng Tầng 3). Giữ sự kiện 7 ngày.
  kafka:
    logging: *logging
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: b5T4hzPsQrOmfv9Kr38lIg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 15s

  # CDC (ADR #22, #38): Debezium Server đọc WAL logic của CSDL bms (publication bms_cdc, tài khoản bamboo_cdc)
  # và ghi mỗi thay đổi vào topic bms.<schema>.<bảng> dạng JSON. Lần đầu chụp ảnh toàn bộ; vị trí đọc lưu ở
  # volume debezium-data. Cấu hình bằng biến môi trường (Quarkus), không cần tệp.
  debezium:
    logging: *logging
    image: quay.io/debezium/server:3.7.0.Final
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      DEBEZIUM_SINK_TYPE: kafka
      DEBEZIUM_SINK_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:9092
      DEBEZIUM_SINK_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      DEBEZIUM_SINK_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      DEBEZIUM_SOURCE_CONNECTOR_CLASS: io.debezium.connector.postgresql.PostgresConnector
      DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME: /debezium/data/offsets.dat
      DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS: 5000
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: db
      DEBEZIUM_SOURCE_DATABASE_PORT: 5432
      DEBEZIUM_SOURCE_DATABASE_USER: bamboo_cdc
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${CDC_DB_PASSWORD:-cdc-db-dev}
      DEBEZIUM_SOURCE_DATABASE_DBNAME: bms
      DEBEZIUM_SOURCE_TOPIC_PREFIX: bms
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
      DEBEZIUM_SOURCE_PUBLICATION_NAME: bms_cdc
      DEBEZIUM_SOURCE_PUBLICATION_AUTOCREATE_MODE: disabled
      DEBEZIUM_SOURCE_SLOT_NAME: bms_debezium
      DEBEZIUM_SOURCE_SCHEMA_INCLUDE_LIST: core,mdm,wf,proc,ic,mfg,collab,cdc
      DEBEZIUM_SOURCE_HEARTBEAT_INTERVAL_MS: 10000
      DEBEZIUM_SOURCE_HEARTBEAT_ACTION_QUERY: UPDATE cdc.heartbeat SET beat_at = now() WHERE id = 1
      DEBEZIUM_SOURCE_DECIMAL_HANDLING_MODE: string
      DEBEZIUM_SOURCE_SNAPSHOT_MODE: initial
      DEBEZIUM_FORMAT_KEY: json
      DEBEZIUM_FORMAT_VALUE: json
      DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE: "false"
      DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE: "false"
      # Heap cố định thay vì 1/4 RAM máy: một connector, lô nhỏ.
      JAVA_OPTS: ${DEBEZIUM_JAVA_OPTS:--Xms64m -Xmx384m}
    volumes:
      - debezium-data:/debezium/data
    restart: unless-stopped
    # Hỏi /q/health bằng /dev/tcp của bash (không phụ thuộc curl trong image); Quarkus trả 503 khi có kiểm tra DOWN.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /q/health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Lakehouse (ADR #39): đọc các topic CDC, ghi lịch sử thay đổi vào bảng Iceberg bronze.<schema>_<bảng> trên
  # bucket bms-lakehouse; catalog ở CSDL `lakehouse` (JDBC catalog của Iceberg). Image riêng vì có pyarrow.
  lakehouse-sink:
    logging: *logging
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        APP_DIR: services/actions
        REQUIREMENTS: requirements-lakehouse.txt
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-lakehouse:${BAMBOO_TAG:-dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      <<: *actions-env
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - lakehouse-secrets:/run/bms:ro
    command: ["python", "-m", "app.lakehouse_sink"]
    restart: unless-stopped

  # Truy vấn Lakehouse (ADR #40): Trino một node, catalog `lakehouse` là catalog Iceberg mà lakehouse-sink ghi.
  # Không xác thực, chỉ dành cho máy dev (127.0.0.1:8085, giao diện web) và dịch vụ nội bộ.
  trino:
    logging: *logging
    build:
      context: ./platform/trino
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-trino:${BAMBOO_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    volumes:
      - trino-catalog:/etc/trino/bms-catalog:ro
    ports:
      - "127.0.0.1:8085:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Tạo bảng bronze còn thiếu và view silver (platform/trino/silver.sql, sinh bằng app.lakehouse_silver) rồi thoát.
  trino-init:
    logging: *logging
    build:
      context: ./platform/trino
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-trino:${BAMBOO_TAG:-dev}
    depends_on:
      trino:
        condition: service_healthy
    command: ["trino", "--server", "http://trino:8080", "--user", "trino-init", "--file", "/etc/trino/bms/silver.sql"]
    restart: "no"

  # Cổng API (ADR #34): điểm vào duy nhất từ trình duyệt. APISIX standalone, route trong
  # platform/apisix/apisix.yaml; WAF Coraza (OWASP CRS); token kiểm tại biên (forward-auth → actions).
  gateway:
    logging: *logging
    build:
      context: ./platform/apisix
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-gateway:${BAMBOO_TAG:-dev}
    depends_on:
      web:
        condition: service_started
      hasura:
        condition: service_started
      keycloak:
        condition: service_started
      seaweedfs:
        condition: service_started
      actions:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:9080"
    restart: unless-stopped
    # Image không có curl: hỏi route /healthz bằng /dev/tcp của bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q ok <&3"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Ứng dụng Refine (Tầng 2), build tĩnh phục vụ bằng nginx, chỉ truy cập qua cổng API.
  web:
    logging: *logging
    build:
      context: ./apps/web/web
    image: ${BAMBOO_IMAGE_PREFIX:-ghcr.io/thanhnlt/bamboo}-web:${BAMBOO_TAG:-dev}
    environment:
      # Cấu hình lúc chạy (docker/40-bamboo-config.sh): cùng một image chạy được trên mọi tên miền.
      BAMBOO_KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8000}
      BAMBOO_HASURA_URL: ${HASURA_PUBLIC_URL:-http://localhost:8000/graphql}
    # Không mở cổng ra ngoài: phục vụ qua cổng API (cổng 5173 để trống cho `npm run dev`).
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- profile test ---------------------------------------------------------
  hasura-test:
    logging: *logging
    profiles: [test]
    image: hasura/graphql-engine:v2.51.0-ce
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *hasura-env
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://bamboo_hasura:${HASURA_DB_PASSWORD:-hasura-db-dev}@db:5432/hasura_meta_test
      BMS_DATABASE_URL: postgres://bamboo_hasura:${HASURA_DB_PASSWORD:-hasura-db-dev}@db:5432/bms_hasura_test
      # Container chạy kiểm thử (`make test-actions` đặt --name bamboo-actions-test).
      ACTIONS_URL: http://bamboo-actions-test:8090
      HASURA_GRAPHQL_AUTH_HOOK: http://bamboo-actions-test:8090/auth/hasura

  actions-test:
    logging: *logging
    profiles: [test]
    <<: *actions-image
    depends_on:
      hasura-test:
        condition: service_started
      flowable:
        condition: service_started
      seaweedfs:
        condition: service_started
      meilisearch:
        condition: service_started
      tika:
        condition: service_started
      gotenberg:
        condition: service_started
      debezium:
        condition: service_started
      lakehouse-sink:
        condition: service_started
      trino-init:
        condition: service_completed_successfully
    environment:
      <<: *actions-env
      # Kiểm thử tải tệp lên/xuống từ trong container nên link có chữ ký trỏ vào mạng nội bộ.
      S3_PUBLIC_ENDPOINT: http://seaweedfs:8333
      BAO_KEYS_FILE: /openbao/keys/init.json
      # Kiểm thử dựng dữ liệu bằng superuser; dịch vụ actions chạy trong lúc kiểm thử dùng tài khoản ứng dụng.
      TEST_DATABASE_URL: postgresql://bms:${POSTGRES_PASSWORD:-bms-dev}@db:5432/bms_hasura_test
      TEST_APP_DATABASE_URL: postgresql://bamboo_actions:${ACTIONS_DB_PASSWORD:-actions-db-dev}@db:5432/bms_hasura_test
      HASURA_URL: http://hasura-test:8080
      ACTIONS_PORT: "8090"
      REQUIRE_SERVICES: "1"
    volumes:
      - ./:/repo
      - actions-secrets:/run/bms:ro
      - openbao-keys:/openbao/keys:ro
    user: "0"
    entrypoint: ["sh", "-c", "pip install -q -r requirements-dev.txt -c /repo/constraints.txt && python -m pytest -q \"$$@\"", "--"]

volumes:
  pgdata:
  seaweedfs-data:
  seaweedfs-config:
  openbao-data:
  openbao-keys:
  actions-secrets:
  bootstrap-secrets:
  search-secrets:
  meilisearch-data:
  meilisearch-config:
  kafka-data:
  debezium-data:
  lakehouse-secrets:
  trino-catalog:
