<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7a3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bamboo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Bamboo: đề nghị mua sắm, phê duyệt theo hạn mức và kiểm toán cho Tập đoàn X."
    />
    <title>Bamboo</title>
    <script>
      // Gắn chế độ sáng/tối trước khi vẽ trang để không nháy nền trắng (khớp contexts/color-mode)
      try {
        var m = localStorage.getItem("colorMode");
        if (m !== "light" && m !== "dark") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = m;
      } catch (e) {}
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <noscript>Cần bật JavaScript để dùng ứng dụng này.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
