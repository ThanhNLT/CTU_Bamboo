server {
    listen 8080;
    root /usr/share/nginx/html;

    # Định tuyến phía trình duyệt (react-router): mọi đường dẫn không phải tệp trả về index.html.
    location / {
        try_files $uri /index.html;
    }
    # Tệp build có hash trong tên: cache lâu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
