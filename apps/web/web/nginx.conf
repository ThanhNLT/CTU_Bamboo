server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Header bảo mật cho mọi phản hồi (always: cả khi lỗi).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Định tuyến phía trình duyệt (react-router): mọi đường dẫn không phải tệp trả về index.html,
    # không cache để bản phát hành mới tới người dùng ngay.
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # Cấu hình lúc chạy do docker-entrypoint.d/40-bamboo-config.sh sinh; thiếu thì dùng bản trong image.
    location = /config.js {
        root /tmp/bamboo;
        try_files /config.js @config_default;
        add_header Cache-Control "no-store" always;
    }
    location @config_default {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }
    # Tệp build có hash trong tên: cache lâu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
