name: Đề xuất tính năng
description: Nhu cầu nghiệp vụ hoặc cải tiến nền tảng
labels: ["needs-triage"]
body:
  - type: textarea
    id: nhu-cau
    attributes:
      label: Nhu cầu
      description: Ai cần, để làm gì (dùng thuật ngữ trong CONTEXT.md)
    validations:
      required: true
  - type: textarea
    id: giai-phap
    attributes:
      label: Giải pháp đề xuất
  - type: textarea
    id: thay-the
    attributes:
      label: Cách khác đã cân nhắc
