#
# Kiểm tra mỗi pull request: giấy phép từng tệp, lint, build giao diện, tài liệu; rồi dựng toàn bộ
# hệ thống bằng đúng một lệnh `docker compose up -d` (ADR #13) và chạy mọi bộ kiểm thử trên đó.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Giấy phép từng tệp (REUSE 3.3)
        run: uvx --from 'reuse[charset-normalizer]' reuse lint
      - name: Python (ruff)
        run: uvx ruff check services --select E,F,W,B --ignore E501
      - name: Docker Compose hợp lệ
        run: docker compose --profile test --profile scan config -q
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/web/package-lock.json
      - name: Giao diện (lint, type-check, build)
        working-directory: apps/web/web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Giấy phép phụ thuộc production của giao diện
        working-directory: apps/web/web
        run: >-
          npx --yes license-checker@25 --production --excludePrivatePackages
          --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;CC0-1.0;MIT OR CC0-1.0'
      - name: Tài liệu (cảnh báo là lỗi)
        run: make -C docs check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Một lệnh dựng toàn bộ hệ thống
        run: time docker compose up -d
      - name: Chờ sẵn sàng
        run: scripts/ci/wait-ready.sh 1200
      - name: Đăng nhập thật mọi tài khoản demo (Keycloak + Hasura webhook)
        run: make test-auth
      - name: Kiểm thử CSDL
        run: make test-db
      - name: Kiểm thử dữ liệu demo
        run: make test-seed
      - name: Kiểm thử tích hợp (Hasura, Flowable, SeaweedFS, OpenBao)
        run: make test-actions
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/web/package-lock.json
      - name: Kiểm thử đầu–cuối qua giao diện (Playwright)
        working-directory: apps/web/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/web/playwright-report
      - name: Tài nguyên sử dụng
        if: always()
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
      - name: Nhật ký khi lỗi
        if: failure()
        run: docker compose --profile test logs --tail 200
