name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.6"
      - name: Khóa phụ thuộc Python (uv.lock khớp pyproject)
        run: |
          uv lock --check
          uv lock --check --project services/ocr
      - name: Giấy phép từng tệp (REUSE 3.3)
        run: uv run --frozen --only-group lint reuse lint
      - name: Python (ruff)
        run: |
          uv run --frozen --only-group lint ruff check services packages --select E,F,W,B --ignore E501
          uv run --frozen --only-group lint ruff check . --select I
          uv run --frozen --only-group lint ruff format --check .
      - name: Docker Compose hợp lệ
        run: |
          docker compose --profile test --profile scan config -q
          COMPOSE_FILE=compose.yaml:infra/compose/mtls.yml \
            docker compose --profile test --profile scan --profile observability --profile logs config -q
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Giao diện và kiểm thử đầu–cuối (lint, định dạng, type-check, build)
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run lint format:check build
      - name: Giấy phép phụ thuộc production của giao diện
        run: node tools/ci/check_licenses.mjs apps/web
      - name: Tài liệu (cảnh báo là lỗi)
        run: make -C docs check

  e2e:
    runs-on: ubuntu-latest
    # Dựng hệ thống ~14 phút, kiểm thử tích hợp ~25 phút, Playwright ~15 phút: 60 phút không còn đủ.
    timeout-minutes: 90
    # Chạy như production: mTLS cho các chặng HTTP nội bộ (infra/compose/mtls.yml, ADR #76).
    env:
      COMPOSE_FILE: compose.yaml:infra/compose/mtls.yml
    steps:
      - uses: actions/checkout@v7
      - name: Giải phóng đĩa runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift /usr/local/julia* /opt/microsoft
          df -h /
      - name: Một lệnh dựng toàn bộ hệ thống
        # Runner chỉ có 2 vCPU, 7 GB: Ollama, OCR chạy CPU chiếm gần 4 GB và gần trọn một nhân, làm các kiểm thử giao
        # diện quá thời gian. Kiểm thử AI dùng Ollama giả lập, kiểm thử giao diện không cần AI, nên CI không chạy chúng.
        run: |
          time docker compose up -d \
            --scale ollama-core=0 --scale ollama-init=0 --scale ocr-core=0 --scale ocr-init=0 --scale ai-worker=0
      - name: Chờ sẵn sàng
        run: tools/ci/wait-ready.sh 1200
      - name: Đăng nhập thật mọi tài khoản demo (Keycloak + Hasura webhook)
        run: make test-auth
      - name: Kiểm thử CSDL
        run: make test-db
      - name: Kiểm thử dữ liệu demo
        run: make test-seed
      - name: Kiểm thử tích hợp (Hasura, Flowable, SeaweedFS, OpenBao)
        run: make test-actions
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Kiểm thử đầu–cuối qua giao diện (Playwright)
        run: |
          pnpm install --frozen-lockfile --filter @bamboo/e2e
          pnpm --filter @bamboo/e2e exec playwright install --with-deps chromium
          pnpm --filter @bamboo/e2e test:e2e
      - name: Kiểm thử cổng API (token tại biên, WAF, chặn dịch vụ nội bộ, giới hạn tần suất)
        run: tools/ci/gateway-smoke.sh
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Tài nguyên sử dụng
        if: always()
        run: |
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
          df -h / /var/lib/docker 2>/dev/null || df -h /
          docker system df
          docker compose exec -T seaweedfs wget -qO- http://localhost:9333/dir/status || true
      - name: Nhật ký khi lỗi
        if: failure()
        run: docker compose --profile test logs --tail 200
