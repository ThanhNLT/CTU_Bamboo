#
# Image dựng sẵn để người khác chạy toàn bộ hệ thống bằng một lệnh, không cần mã nguồn:
#   docker compose -f oci://ghcr.io/thanhnlt/bamboo:<phiên bản> up -d -y
# 1. build: 7 image của dự án, amd64 + arm64, đẩy lên GHCR.
# 2. compose: sinh compose.release.yml (chỉ image, không build, không bind mount) và phát hành
#    dưới dạng OCI artifact cùng registry.
# 3. smoke: trên máy sạch, chạy đúng lệnh một dòng ở trên (cờ -y đặt sau `up`: chạy được trên Compose 2.34+ và v5, không hỏi xác nhận biến của compose từ xa) rồi chạy kiểm thử đầu–cuối qua giao diện.
#
# Thẻ: pull request → pr-<số>; nhánh main → sha-<7 ký tự> và latest; thẻ git vX.Y.Z → X.Y.Z.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PREFIX: ghcr.io/thanhnlt/bamboo

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: actions, context: ., file: docker/python.Dockerfile, args: "APP_DIR=services/actions" }
          - { name: seed, context: ., file: docker/python.Dockerfile, args: "APP_DIR=services/seed" }
          - { name: migrate, context: ., file: docker/migrate.Dockerfile, args: "" }
          - { name: keycloak, context: platform/keycloak, file: platform/keycloak/Dockerfile, args: "" }
          - { name: openbao, context: platform/openbao, file: platform/openbao/Dockerfile, args: "" }
          - { name: gateway, context: platform/apisix, file: platform/apisix/Dockerfile, args: "" }
          - { name: web, context: apps/web/web, file: apps/web/web/Dockerfile, args: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=pr
            type=sha,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=bamboo-${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=DX-OS Open-Core contributors
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  compose:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        name: Chọn thẻ phát hành
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then tag="pr-${{ github.event.number }}"
          else tag="sha-${GITHUB_SHA::7}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Sinh compose.release.yml
        run: |
          pip install --quiet pyyaml
          python scripts/release/compose_release.py "${{ steps.tag.outputs.tag }}" compose.release.yml
          docker compose -f compose.release.yml config -q
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Phát hành compose dạng OCI artifact
        run: |
          docker compose version
          docker compose -f compose.release.yml publish --yes --with-env "${PREFIX}:${{ steps.tag.outputs.tag }}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker compose -f compose.release.yml publish --yes --with-env "${PREFIX}:latest"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: compose.release.yml
          path: compose.release.yml

  smoke:
    needs: compose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ needs.compose.outputs.tag }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Một lệnh, không cần mã nguồn
        working-directory: ${{ runner.temp }}
        run: time docker compose -f "oci://${PREFIX}:${TAG}" up -d -y
      # Mã nguồn chỉ để lấy script chờ và bộ kiểm thử, không dùng để dựng hệ thống.
      - uses: actions/checkout@v7
      - name: Chờ sẵn sàng
        run: scripts/ci/wait-ready.sh 1200
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/web/package-lock.json
      - name: Kiểm thử đầu–cuối qua giao diện (Playwright)
        working-directory: apps/web/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Kiểm thử cổng API
        run: scripts/ci/gateway-smoke.sh
      - name: Tài nguyên sử dụng
        if: always()
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
      - name: Nhật ký khi lỗi
        if: failure()
        run: docker compose -p bamboo logs --tail 200
