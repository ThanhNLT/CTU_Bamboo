# Một lệnh dựng toàn bộ hệ thống (ADR #13): `docker compose up -d` (hoặc `make up`) tại gốc repo.
# Định nghĩa dịch vụ nằm trong infra/compose/, chia theo nhóm; mỗi tệp được nạp như một mô hình riêng nên đường dẫn
# tương đối trong đó tính từ infra/compose/. Biến môi trường lấy từ shell và tệp .env ở gốc repo (thư mục dự án).
# GPU NVIDIA: make up-gpu (= -f compose.yaml -f infra/compose/gpu.yml).
name: bamboo

include:
  - infra/compose/core.yml # CSDL, migrate, seed, Keycloak, Flowable, Hasura, OpenBao, SeaweedFS, actions, cổng API, web
  - infra/compose/data.yml # Meilisearch, Tika, Gotenberg, Kafka, Debezium, Lakehouse, Trino, sleeper
  - infra/compose/ai.yml # Ollama, OCR, ai-worker
  - infra/compose/scan.yml # ClamAV (profile scan)
  - infra/compose/test.yml # hasura-test, actions-test (profile test)
